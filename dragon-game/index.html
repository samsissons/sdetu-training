<title>Hatchling Hollow</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Macondo&family=Shantell+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: one-screen app. Header (name, level) / living stage canvas / tabbed tool tray. Single dusk theme by choice. */
:root {
  --night: #1d1733;
  --panel: #2a2147;
  --panel-2: #362b5a;
  --ink: #f6ecd9;
  --muted: #b9aed3;
  --ember: #ff8a3d;
  --gold: #f2c14e;
  --moss: #7fd18b;
  --rose: #ef6f8e;
  --line: rgba(246, 236, 217, 0.14);
  --font-display: "Macondo", "Papyrus", Georgia, serif;
  --font-ui: "Shantell Sans", "Comic Sans MS", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--night);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 15px;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
#app {
  height: 100%;
  max-width: 820px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px;
  gap: 10px;
  box-sizing: border-box;
}
header {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 4px 12px;
  align-items: center;
}
.name-row { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
#dname {
  font-family: var(--font-display);
  font-size: 1.9rem;
  line-height: 1;
  margin: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  background: none; border: 0; color: var(--ink); padding: 0; cursor: pointer;
  text-align: left;
}
#dname:focus-visible { outline: 2px dashed var(--gold); outline-offset: 4px; }
#species { color: var(--muted); font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lvl {
  display: flex; align-items: center; gap: 8px; grid-column: 1 / -1;
  font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums;
}
.lvl b { color: var(--gold); font-weight: 700; letter-spacing: 0.04em; }
.bar { flex: 1; height: 8px; border-radius: 99px; background: var(--panel-2); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; border-radius: inherit; transition: width .4s ease; }
#xpbar > i { background: linear-gradient(90deg, var(--ember), var(--gold)); }
.btn {
  font: inherit; font-weight: 600; color: var(--ink);
  background: var(--panel-2); border: 1px solid var(--line);
  border-radius: 12px; padding: 8px 14px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
}
.btn:hover { border-color: rgba(246,236,217,.35); }
.btn:focus-visible, .chip:focus-visible, .sw:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.btn.primary { background: var(--ember); color: #2a1408; border-color: transparent; }
.btn svg { width: 18px; height: 18px; }

#stagewrap {
  position: relative; flex: 1; min-height: 0;
  border-radius: 20px; overflow: hidden;
  box-shadow: inset 0 0 0 1px var(--line);
}
#stage { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
.stats {
  position: absolute; left: 12px; right: 12px; bottom: 10px;
  display: flex; gap: 12px; pointer-events: none;
}
.stat {
  flex: 1; display: flex; align-items: center; gap: 8px;
  background: rgba(29, 23, 51, 0.72); backdrop-filter: blur(4px);
  padding: 6px 10px; border-radius: 99px; font-size: 0.78rem; color: var(--muted);
}
.stat span { width: 52px; }
#hungerbar > i { background: var(--ember); }
#joybar > i { background: var(--rose); }
#toast {
  position: absolute; left: 50%; top: 14px; transform: translateX(-50%) translateY(-8px);
  background: var(--gold); color: #2b1d05; font-weight: 700;
  padding: 8px 16px; border-radius: 99px; opacity: 0; transition: opacity .3s, transform .3s;
  pointer-events: none; max-width: calc(100% - 32px); text-align: center; font-size: 0.9rem;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

nav.tabs { display: flex; gap: 6px; }
nav.tabs button {
  flex: 1; font: inherit; font-weight: 700; color: var(--muted);
  background: transparent; border: 1px solid var(--line); border-radius: 12px;
  padding: 8px 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
}
nav.tabs button[aria-selected="true"] { color: #2a1408; background: var(--gold); border-color: transparent; }
nav.tabs svg { width: 18px; height: 18px; }
.panel {
  background: var(--panel); border-radius: 16px; padding: 12px;
  display: flex; flex-direction: column; gap: 10px;
  max-height: 38vh; overflow-y: auto;
}
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.hint { color: var(--muted); font-size: 0.85rem; margin: 0; }
.label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); width: 100%; }
.chip {
  font: inherit; font-size: 0.85rem; font-weight: 600; color: var(--ink);
  background: var(--panel-2); border: 2px solid transparent; border-radius: 10px;
  padding: 6px 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
}
.chip[aria-pressed="true"] { border-color: var(--gold); background: #4a3a72; }
.chip[disabled] { opacity: .45; cursor: not-allowed; }
.chip svg { width: 20px; height: 20px; }
.chip small { color: var(--muted); font-weight: 400; }
.sw {
  width: 30px; height: 30px; border-radius: 50%; border: 2px solid rgba(0,0,0,.25);
  cursor: pointer; padding: 0;
}
.sw[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--panel), 0 0 0 5px var(--gold); }
.sw.locked { opacity: .35; cursor: not-allowed; }
#picker { width: 34px; height: 34px; border: 0; padding: 0; background: none; cursor: pointer; }
input[type=range] { accent-color: var(--ember); flex: 1; min-width: 100px; }
.food { flex-direction: column; gap: 2px; padding: 8px 12px; min-width: 76px; }
.food svg { width: 34px; height: 34px; }

dialog {
  background: var(--panel); color: var(--ink); border: 1px solid var(--line);
  border-radius: 20px; padding: 20px; width: min(520px, calc(100vw - 32px)); box-sizing: border-box;
}
dialog::backdrop { background: rgba(10, 6, 24, 0.7); }
dialog h2 { font-family: var(--font-display); font-weight: 400; font-size: 1.8rem; margin: 0 0 6px; }
dialog p { color: var(--muted); margin: 0 0 14px; }
.lair { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; max-height: 55vh; overflow-y: auto; }
.card {
  background: var(--panel-2); border: 2px solid transparent; border-radius: 14px; padding: 8px;
  cursor: pointer; text-align: left; font: inherit; color: var(--ink); display: flex; flex-direction: column; gap: 4px;
}
.card[aria-current="true"] { border-color: var(--gold); }
.card canvas { width: 100%; aspect-ratio: 6/5; border-radius: 10px; background: #ddd3f3; }
.card b { font-family: var(--font-display); font-weight: 400; font-size: 1.1rem; }
.card small { color: var(--muted); font-size: 0.75rem; }
.card.new { align-items: center; justify-content: center; border: 2px dashed var(--line); background: transparent; min-height: 150px; text-align: center; }
.card.new[disabled] { cursor: not-allowed; opacity: .6; }
#nameinput {
  font: inherit; font-family: var(--font-display); font-size: 1.5rem; width: 100%; box-sizing: border-box;
  background: var(--night); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 14px;
}
.dlg-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 14px; }
@media (max-width: 480px) {
  #dname { font-size: 1.5rem; }
  .stat span { width: auto; }
}
@media (prefers-reduced-motion: reduce) {
  .bar > i, #toast { transition: none; }
}
</style>

<div id="app">
  <header>
    <div class="name-row">
      <button id="dname" title="Rename">Ember</button>
      <span id="species"></span>
    </div>
    <button class="btn" id="lairbtn" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18M5 20V11a7 7 0 0 1 14 0v9M9 20v-5a3 3 0 0 1 6 0v5"/></svg>
      Lair
    </button>
    <div class="lvl"><b id="lvltext">LV 1</b><div class="bar" id="xpbar"><i></i></div><span id="xptext">0 / 35</span></div>
  </header>

  <div id="stagewrap">
    <canvas id="stage" aria-label="Your dragon. Tap the egg to warm it, rub the dragon to pet it, or paint it in Paint mode."></canvas>
    <div class="stats" id="stats">
      <div class="stat"><span>Hunger</span><div class="bar" id="hungerbar"><i></i></div></div>
      <div class="stat"><span>Joy</span><div class="bar" id="joybar"><i></i></div></div>

  <nav class="tabs" id="tabs" role="tablist">
    <button role="tab" data-mode="care" aria-selected="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>Care</button>
    <button role="tab" data-mode="paint" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 3l3 3-9 9-4 1 1-4z"/><path d="M7 17c-2 0-4 1-4 4 2 0 5 0 6-2"/></svg>Paint</button>
    <button role="tab" data-mode="dress" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 18l2-10 5 5 2-8 2 8 5-5 2 10z"/></svg>Dress</button>
  </nav>

  <section class="panel" id="panel-egg" hidden>

  </section>

  <section class="panel" id="panel-care">
    <p class="hint">Rub your dragon to pet it. Feed it when it gets peckish.</p>
    <div class="row" id="foods"></div>
  </section>

  <section class="panel" id="panel-paint" hidden>
    <div class="row" id="tools"></div>
    <div class="row" id="brushes"></div>
    <div class="row" id="stamps" hidden></div>
    <div class="row"><span class="hint">Size</span><input type="range" id="size" min="3" max="48" value="14"></div>
    <div class="row" id="palette"></div>
    <div class="row">
      <button class="btn" id="undo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>Undo</button>
      <button class="btn" id="clearpaint">Wash off paint</button>
    </div>
  </section>

  <section class="panel" id="panel-dress" hidden>
    <p class="hint">Trinkets from your dragon's hoard. More appear as it grows.</p>
    <div class="row" id="accs"></div>
  </section>
</div>

<dialog id="lairdlg">
  <h2>The Lair</h2>
  <p id="lairnote"></p>
  <div class="lair" id="lairgrid"></div>
  <div class="dlg-actions"><button class="btn" id="lairclose">Close</button></div>
</dialog>

<dialog id="namedlg">
  <h2 id="nametitle">It hatched!</h2>
  <p>What will you call your dragon?</p>
  <form id="nameform">
    <input id="nameinput" maxlength="18" autocomplete="off" aria-label="Dragon name">
    <div class="dlg-actions">
      <button type="button" class="btn" id="namereroll">Another idea</button>
      <button type="submit" class="btn primary">That's the one</button>
    </div>
  </form>
</dialog>

<script>
(() => {
'use strict';
// ---------- constants ----------
const W = 600, H = 500;
const STAGES = [
  { name: 'Hatchling', min: 1, scale: 0.62 },
  { name: 'Fledgling', min: 3, scale: 0.8 },
  { name: 'Grown', min: 6, scale: 0.97 },
];
const SPECIES = [
  [0, 'Ember Wyrm'], [25, 'Amber Drake'], [50, 'Sunscale'], [85, 'Mossback'], [150, 'Tidewing'],
  [195, 'Skyfin'], [245, 'Duskhorn'], [290, 'Rosefire'], [335, 'Ember Wyrm'],
];
const NAMES = ['Pip', 'Cinder', 'Bramble', 'Moth', 'Fennel', 'Ash', 'Nimbus', 'Quill', 'Saffron', 'Tumble',
  'Wisp', 'Pebble', 'Juniper', 'Smudge', 'Kettle', 'Ivy', 'Biscuit', 'Comet', 'Sorrel', 'Tinder', 'Marrow', 'Plum'];
const xpNeed = l => 20 + l * 15;
const UNLOCKS = [
  { lvl: 1, kind: 'stamp', id: 'spot', label: 'Spot' },
  { lvl: 1, kind: 'stamp', id: 'heart', label: 'Heart' },
  { lvl: 2, kind: 'stamp', id: 'star', label: 'Star' },
  { lvl: 2, kind: 'acc', id: 'bow', label: 'Tail bow' },
  { lvl: 3, kind: 'color', id: 'picker', label: 'Any colour' },
  { lvl: 3, kind: 'acc', id: 'flower', label: 'Flower' },
  { lvl: 3, kind: 'stamp', id: 'scale', label: 'Scale' },
  { lvl: 4, kind: 'brush', id: 'rainbow', label: 'Rainbow brush' },
  { lvl: 4, kind: 'acc', id: 'scarf', label: 'Scarf' },
  { lvl: 5, kind: 'stamp', id: 'flame', label: 'Flame' },
  { lvl: 5, kind: 'acc', id: 'glasses', label: 'Spectacles' },
  { lvl: 6, kind: 'brush', id: 'glitter', label: 'Glitter brush' },
  { lvl: 7, kind: 'acc', id: 'crown', label: 'Crown' },
  { lvl: 7, kind: 'stamp', id: 'moon', label: 'Moon' },
  { lvl: 8, kind: 'acc', id: 'hat', label: 'Wizard hat' },
];
const unlocked = (d, id) => { const u = UNLOCKS.find(u => u.id === id); return !u || d.level >= u.lvl; };
const PALETTE = ['#e8473b', '#f59e2b', '#f7d046', '#7cc95b', '#2f9e8f', '#3f7fd9', '#7b5cd6', '#d35fae',
  '#f4efe6', '#3a3340', '#8a5a3c', '#9fd8f0'];

// ---------- geometry (fluffy dragon sitting, facing the viewer; local 600x500, ground at y=440) ----------
const P = s => new Path2D(s);
const MIRROR = new DOMMatrix([-1, 0, 0, 1, 600, 0]);
const mirrored = p => { const m = new Path2D(); m.addPath(p, MIRROR); return m; };
const both = p => { const m = new Path2D(); m.addPath(p); m.addPath(p, MIRROR); return m; };
function cubicPt(p, t) {
  const u = 1 - t;
  return [0, 1].map(i => u * u * u * p[0][i] + 3 * u * u * t * p[1][i] + 3 * u * t * t * p[2][i] + t * t * t * p[3][i]);
}
// a tapered limb/tail/horn along a cubic centre line
function ribbon(p, w0, w1, n = 28) {
  const L = [], R = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n, a = cubicPt(p, Math.max(0, t - 0.01)), b = cubicPt(p, Math.min(1, t + 0.01)), c = cubicPt(p, t);
    let nx = -(b[1] - a[1]), ny = b[0] - a[0]; const len = Math.hypot(nx, ny) || 1; nx /= len; ny /= len;
    const w = (w0 + (w1 - w0) * t) / 2;
    L.push([c[0] + nx * w, c[1] + ny * w]); R.push([c[0] - nx * w, c[1] - ny * w]);
  }
  const path = new Path2D();
  path.moveTo(...L[0]);
  for (const q of L.slice(1)) path.lineTo(...q);
  const end = cubicPt(p, 1);
  path.quadraticCurveTo(end[0] + (L[n][0] - R[n][0]) * 0.1 + (end[0] - cubicPt(p, 0.97)[0]) * 3, end[1] + (end[1] - cubicPt(p, 0.97)[1]) * 3, ...R[n]);
  for (const q of R.reverse().slice(1)) path.lineTo(...q);
  path.closePath();
  return path;
}
// fur: an ellipse whose edge is a ring of soft pointed tufts
function furBlob(cx, cy, rx, ry, n, depth, a0 = 0, a1 = Math.PI * 2) {
  const path = new Path2D(), pts = [];
  for (let i = 0; i <= n; i++) {
    const a = a0 + (a1 - a0) * (i + (i % n ? Math.sin(i * 3.7 + cx) * 0.25 : 0)) / n, j = i % n ? 1 + Math.sin(i * 2.3 + cy) * 0.05 : 1;
    pts.push([cx + Math.cos(a) * rx * j, cy + Math.sin(a) * ry * j]);
  }
  path.moveTo(...pts[0]);
  for (let i = 1; i < pts.length; i++) {
    const [x0, y0] = pts[i - 1], [x1, y1] = pts[i], mx = (x0 + x1) / 2, my = (y0 + y1) / 2;
    const k = depth / Math.hypot(mx - cx, my - cy);
    path.quadraticCurveTo(mx - (mx - cx) * k, my - (my - cy) * k, x1, y1);
  }
  path.closePath();
  return path;
}
const ellipse = (cx, cy, rx, ry) => { const p = new Path2D(); p.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2); return p; };

// feathered wing (left side; the right is its mirror)
const WING_TIPS = [[40, 136], [32, 186], [40, 234], [56, 276], [80, 312], [112, 338], [150, 350], [190, 342], [224, 322], [252, 300]];
const wingL = (() => {
  const p = new Path2D();
  p.moveTo(266, 262);
  p.bezierCurveTo(236, 200, 196, 124, 146, 74);
  p.bezierCurveTo(118, 50, 80, 56, 58, 86);
  let prev = [58, 86];
  for (const tip of WING_TIPS) {
    const mx = (prev[0] + tip[0]) / 2, my = (prev[1] + tip[1]) / 2;
    p.quadraticCurveTo(mx + (180 - mx) * 0.38, my + (180 - my) * 0.38, tip[0], tip[1]);
    prev = tip;
  }
  p.closePath();
  return p;
})();
const head = new Path2D();
head.addPath(ellipse(300, 158, 92, 70));
head.addPath(furBlob(222, 188, 30, 25, 8, 7));
head.addPath(furBlob(378, 188, 30, 25, 8, 7));
head.addPath(furBlob(300, 96, 28, 15, 8, 6));
const earL = P('M238 116 C200 100 154 120 128 168 C162 180 206 172 240 156 Z');
const earInnerL = P('M234 126 C204 118 166 134 146 164 C172 170 204 164 234 150 Z');
const legL = ribbon([[266, 296], [264, 350], [262, 392], [262, 428]], 46, 38);
const G = {
  wingL, wingR: mirrored(wingL),
  tail: ribbon([[372, 418], [462, 462], [572, 452], [552, 372]], 32, 14),
  tuft: furBlob(552, 346, 22, 34, 9, 10),
  body: ellipse(300, 335, 106, 105),
  haunches: both(furBlob(208, 386, 74, 56, 13, 6)),
  backFeet: both(ellipse(172, 433, 36, 14)),
  frontLegs: both(legL),
  paws: both(ellipse(262, 432, 27, 15)),
  bib: furBlob(300, 290, 74, 94, 18, 11),
  ears: both(earL),
  head,
  muzzle: ellipse(300, 200, 42, 27),
};
G.earInner = both(earInnerL);
const BODY_KEYS = ['tail', 'tuft', 'body', 'haunches', 'backFeet', 'frontLegs', 'paws', 'bib', 'ears', 'head', 'muzzle'];
G.union = new Path2D();
for (const k of BODY_KEYS) G.union.addPath(G[k]);
const WING = { far: { pivot: [266, 262], sign: 1 }, near: { pivot: [334, 262], sign: -1 } };
const EYES = [[262, 160], [338, 160]], MOUTH = [300, 212];
// horns grow with the stage: nubs, then curls, then curls with a fork
const hornBase = ribbon([[268, 106], [252, 72], [234, 48], [256, 20]], 17, 3);
const hornFork = ribbon([[248, 62], [238, 52], [226, 48], [218, 36]], 8, 2);
const HORNS = [0.36, 0.72, 1].map((s, i) => {
  const m = new DOMMatrix().translate(268, 106).scale(s).translate(-268, -106), p = new Path2D();
  p.addPath(hornBase, m); p.addPath(hornBase, MIRROR.multiply(m));
  if (i === 2) { p.addPath(hornFork, m); p.addPath(hornFork, MIRROR.multiply(m)); }
  return p;
});
const FUR_MARKS = [[292, 246], [314, 290], [282, 330], [320, 352], [190, 372], [410, 372], [300, 118]];
const EGG = (() => {
  const p = new Path2D();
  p.moveTo(300, 140);
  p.bezierCurveTo(372, 140, 402, 260, 402, 318);
  p.bezierCurveTo(402, 388, 356, 420, 300, 420);
  p.bezierCurveTo(244, 420, 198, 388, 198, 318);
  p.bezierCurveTo(198, 260, 228, 140, 300, 140);
  p.closePath();
  return p;
})();
// paintable parts, topmost first
const PARTS = [
  { id: 'muzzle', layer: 'body', path: G.muzzle },
  { id: 'head', layer: 'body', path: G.head },
  { id: 'ears', layer: 'body', path: G.ears },
  { id: 'paws', layer: 'body', path: G.paws },
  { id: 'frontLegs', layer: 'body', path: G.frontLegs },
  { id: 'bib', layer: 'body', path: G.bib },
  { id: 'backFeet', layer: 'body', path: G.backFeet },
  { id: 'haunches', layer: 'body', path: G.haunches },
  { id: 'body', layer: 'body', path: G.body },
  { id: 'tuft', layer: 'body', path: G.tuft },
  { id: 'tail', layer: 'body', path: G.tail },
  { id: 'wingR', layer: 'near', path: G.wingR },
  { id: 'wingL', layer: 'far', path: G.wingL },
];
const LAYER_CLIP = { body: G.union, near: G.wingR, far: G.wingL };
const hitCtx = document.createElement('canvas').getContext('2d');
const partAt = (x, y) => PARTS.find(p => hitCtx.isPointInPath(p.path, x, y));

// ---------- state ----------
let save = load();

  drawBackground(ctx, view.w, view.h, anim.t);
  view.tf = dragonTransform();
  const t = view.tf;
  if (mode !== 'paint') {
    const gx = t.ox + 300 * t.s, gy = t.oy + 438 * t.s;
    ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(gx, t.oy + 250 * t.s, 230 * t.s, 0, Math.PI * 2); ctx.stroke();
    if (cur.hatched) { ctx.fillStyle = 'rgba(90,60,120,0.28)'; ctx.beginPath(); ctx.ellipse(gx, gy + 2, 200 * t.s, 22 * t.s, 0, 0, Math.PI * 2); ctx.fill(); }

    const [sx, sy] = toScreen(120 + Math.random() * 360, 60 + Math.random() * 360);
    emit({ type: 'spark', x: sx, y: sy, vy: -8, life: 1.2, max: 1.2, size: 4 + Math.random() * 4, color: '#ffffff' });
  }
  if (cur.hatched && mode !== 'paint' && cur.joy > 70 && Math.random() < dt * 0.35) {
    const [hx, hy] = toScreen(300 + (Math.random() - 0.5) * 120, 40);
    emit({ type: 'heart', x: hx, y: hy, vy: -18, life: 2, max: 2, size: 7, color: '#ef6f8e' });
  }

// ---------- stats & progression ----------
let statSaveAcc = 0;

  for (const d of save.dragons) if (d.hatched) {

  }

}

    cur.xp -= xpNeed(cur.level); cur.level++; leveled = true;
    const before = STAGES.findIndex(s => s.min === cur.level);
    const got = UNLOCKS.filter(u => u.lvl === cur.level).map(u => u.label);
    let msg = `${cur.name} reached level ${cur.level}!`;
    if (before > 0) msg = `${cur.name} grew into a ${STAGES[before].name}!`;
    if (got.length) msg += ' New: ' + got.join(', ');
    toast(msg, 4200);
    anim.flapUntil = performance.now() + 1800;
    const [cx, cy] = toScreen(300, 200);
    for (let i = 0; i < 40; i++) emit({ type: 'spark', x: cx, y: cy, vx: (Math.random() - 0.5) * 500, vy: (Math.random() - 0.8) * 400, g: 300, life: 1.4, max: 1.4, size: 6 + Math.random() * 6, color: Math.random() > 0.5 ? '#f2c14e' : '#fff3d0' });

}

}

  document.getElementById('dname').textContent = cur.name;
  document.getElementById('species').textContent = cur.hatched ? `${stageOf(cur).name} ${speciesOf(cur)}` : `${speciesOf(cur)} egg`;
  document.getElementById('lvltext').textContent = `LV ${cur.level}`;
  const need = xpNeed(cur.level);
  document.querySelector('#xpbar > i').style.width = (cur.xp / need * 100) + '%';
  document.getElementById('xptext').textContent = `${Math.floor(cur.xp)} / ${need}`;
  document.querySelector('#warmbar > i').style.width = cur.warmth + '%';

}

// ---------- care actions ----------
const FOODS = [
  { id: 'berries', label: 'Berries', hunger: 18, joy: 4 },
  { id: 'fish', label: 'Fish', hunger: 34, joy: 6 },
  { id: 'pepper', label: 'Fire pepper', hunger: 10, joy: 14, fire: true },

  const r = btn.getBoundingClientRect(), cr = cv.getBoundingClientRect();
  flying.push({
    id: food.id, k: 0, x0: Math.min(view.w - 30, Math.max(30, r.left + r.width / 2 - cr.left)), y0: view.h - 10,
    done: () => {
      const [mx, my] = toScreen(MOUTH[0], MOUTH[1]);
      for (let i = 0; i < 10; i++) emit({ x: mx, y: my, vx: (Math.random() - 0.3) * 160, vy: -Math.random() * 120, g: 500, life: 0.7, max: 0.7, size: 3, color: '#f6ecd9' });
      emit({ type: 'text', x: mx, y: my - 50, vy: -40, life: 1, max: 1, size: 20, text: 'nom!', color: '#fff3d0' });
      const wasHungry = cur.hunger < 60;
      cur.hunger = Math.min(100, cur.hunger + food.hunger);
      cur.joy = Math.min(100, cur.joy + food.joy);
      if (food.fire) setTimeout(() => { anim.fireUntil = performance.now() + 1400; anim.flapUntil = performance.now() + 1400; }, 350);
      gainXp(wasHungry ? 9 : 5);

  });
}
let petAcc = 0;
function pet(x, y) {

// ---------- painting ----------

// ---------- pointer input ----------
let pointerDown = false, lastPet = null;
cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId);
  pointerDown = true;
  const r = cv.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
  const [x, y] = toLocal(px, py);
  if (!cur.hatched) { if (hitCtx.isPointInPath(EGG, x, y)) warmEgg(px, py, 7); return; }
  if (mode === 'paint') {
    const part = partAt(x, y);
    if (!part) return;
    if (paint.tool === 'fill') return fillPart(part);
    if (paint.tool === 'stamp') return doStamp(part, x, y);
    pushUndo(part.layer);
    stroke = { layer: part.layer, x, y };
    paintSeg(part.layer, x, y, x + 0.01, y);
    return;
  }
  if (partAt(x, y)) { lastPet = [px, py]; pet(px, py); }
});

  if (!pointerDown) return;
  const r = cv.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
  const [x, y] = toLocal(px, py);
  if (!cur.hatched) { if (hitCtx.isPointInPath(EGG, x, y)) warmEgg(px, py, 0.6); return; }
  if (mode === 'paint') {
    if (stroke) { paintSeg(stroke.layer, stroke.x, stroke.y, x, y); stroke.x = x; stroke.y = y; }
    return;

function foodIcon(id) {

function buildPanels() {

  }

  }
  const brushes = document.getElementById('brushes'); brushes.innerHTML = '';

    const u = UNLOCKS.find(u => u.id === id), lock = u && cur.level < u.lvl;

  }

    const b = document.createElement('button');
    b.className = 'sw'; b.type = 'button'; b.style.background = col; b.title = col;
    b.setAttribute('aria-label', 'Colour ' + col);
    b.setAttribute('aria-pressed', paint.color === col ? 'true' : 'false');
    b.addEventListener('click', () => { paint.color = col; if (paint.brush === 'rainbow') paint.brush = 'round'; if (paint.tool === 'eraser') paint.tool = 'brush'; buildPanels(); });
    pal.appendChild(b);
  }
  if (unlocked(cur, 'picker')) {
    const inp = document.createElement('input'); inp.type = 'color'; inp.id = 'picker'; inp.value = paint.color; inp.title = 'Any colour';
    inp.addEventListener('input', () => { paint.color = inp.value; });
    pal.appendChild(inp);
  } else {
    const s = document.createElement('small'); s.className = 'hint'; s.textContent = 'Any colour at LV 3'; pal.appendChild(s);
  }
  // accessories
  const accs = document.getElementById('accs'); accs.innerHTML = '';
  for (const u of UNLOCKS.filter(u => u.kind === 'acc')) {
    const lock = cur.level < u.lvl;
    accs.appendChild(chip(lock ? `${u.label} <small>LV ${u.lvl}</small>` : u.label, !!(cur.acc && cur.acc[u.id]), () => {
      cur.acc = cur.acc || {}; cur.acc[u.id] = !cur.acc[u.id];
      if (u.id === 'crown' && cur.acc.crown) cur.acc.hat = false;
      if (u.id === 'hat' && cur.acc.hat) cur.acc.crown = false;
      if (cur.acc[u.id]) { cur.joy = Math.min(100, cur.joy + 3); anim.flapUntil = performance.now() + 700; }
      persist(); buildPanels(); updateBars();
    }, lock));
  }
  const clr = document.getElementById('clearpaint');
  clr.textContent = clr.dataset.armed ? 'Tap again to wash off all paint' : 'Wash off paint';
}
function setMode(m) {
  mode = m;
  const egg = !cur.hatched;
  document.getElementById('tabs').hidden = egg;
  document.getElementById('stats').hidden = egg || m === 'paint';
  document.getElementById('panel-egg').hidden = !egg;
  for (const id of ['care', 'paint', 'dress']) document.getElementById('panel-' + id).hidden = egg || m !== id;
  for (const b of document.querySelectorAll('#tabs button')) b.setAttribute('aria-selected', b.dataset.mode === m ? 'true' : 'false');
  buildPanels(); updateHeader();
}
document.querySelectorAll('#tabs button').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));
document.getElementById('size').addEventListener('input', e => { paint.size = +e.target.value; });
document.getElementById('undo').addEventListener('click', () => {
  for (let i = undoStack.length - 1; i >= 0; i--) {
    if (undoStack[i].id !== cur.id) continue;
    const u = undoStack.splice(i, 1)[0];
    lctx(u.layer).putImageData(u.img, 0, 0); persistLayers(cur); return;
  }
  toast('Nothing to undo yet.');
});
document.getElementById('clearpaint').addEventListener('click', e => {
  const b = e.currentTarget;
  if (!b.dataset.armed) { b.dataset.armed = '1'; buildPanels(); setTimeout(() => { delete b.dataset.armed; buildPanels(); }, 3000); return; }
  delete b.dataset.armed;
  for (const k of ['body', 'near', 'far']) { pushUndo(k); lctx(k).clearRect(0, 0, W, H); }
  persistLayers(cur); buildPanels(); toast('Squeaky clean. Undo brings the paint back.');
});

// ---------- naming ----------
const nameDlg = document.getElementById('namedlg'), nameInput = document.getElementById('nameinput');
const randomName = () => NAMES[Math.floor(Math.random() * NAMES.length)];
function openName(isHatch) {
  document.getElementById('nametitle').textContent = isHatch ? 'It hatched!' : 'Rename your dragon';
  nameInput.value = isHatch ? randomName() : cur.name;
  nameDlg.showModal(); nameInput.select();
}
document.getElementById('namereroll').addEventListener('click', () => { nameInput.value = randomName(); });
document.getElementById('nameform').addEventListener('submit', e => {
  e.preventDefault();
  cur.name = nameInput.value.trim().slice(0, 18) || randomName();
  nameDlg.close(); persist(); updateHeader();
});
document.getElementById('dname').addEventListener('click', () => { if (cur.hatched) openName(false); else toast('Hatch the egg first, then you can name it.'); });

// ---------- lair ----------
const lairDlg = document.getElementById('lairdlg');
function eggSlots() {
  const hatched = save.dragons.filter(d => d.hatched);
  const extra = hatched.reduce((s, d) => s + (d.level - 1), 0);
  return { slots: Math.min(8, 1 + Math.floor(extra / 4)), extra, next: 4 - (extra % 4) };
}
function drawThumbs() {
  for (const c of document.querySelectorAll('#lairgrid canvas')) {
    const d = save.dragons.find(x => x.id === c.dataset.id); if (!d) continue;
    const x = c.getContext('2d'); x.setTransform(1, 0, 0, 1, 0, 0);
    drawBackground(x, c.width, c.height, 0);
    x.setTransform(c.width / W, 0, 0, c.height / H, 0, 0);
    if (d.hatched) renderDragon(x, d, { flap: 0.05, blink: 0, happy: false, mouth: 0, look: 0 });
    else { x.translate(60, 40); x.scale(0.8, 0.8); renderEgg(x, d, { wobble: 0 }); }
  }
}
function openLair() {
  const grid = document.getElementById('lairgrid'); grid.innerHTML = '';
  const { slots, next } = eggSlots();
  for (const d of save.dragons) {
    const b = document.createElement('button'); b.className = 'card'; b.type = 'button';
    if (d.id === cur.id) b.setAttribute('aria-current', 'true');
    b.innerHTML = `<canvas width="300" height="250" data-id="${d.id}"></canvas><b></b><small></small>`;
    b.querySelector('b').textContent = d.hatched ? d.name : 'Unhatched egg';
    b.querySelector('small').textContent = d.hatched ? `LV ${d.level} ${stageOf(d).name} ${speciesOf(d)}` : `${speciesOf(d)} egg`;
    b.addEventListener('click', () => { cur = d; undoStack = []; lairDlg.close(); setMode(cur.hatched ? 'care' : 'care'); persist(); });
    grid.appendChild(b);
  }
  const canAdd = save.dragons.length < slots;
  const nb = document.createElement('button'); nb.className = 'card new'; nb.type = 'button';
  nb.innerHTML = canAdd ? '<b>Find a new egg</b><small>A new egg is waiting in the hollow</small>' : `<b>Next egg</b><small>Raise your dragons ${next} more level${next === 1 ? '' : 's'}</small>`;
  if (!canAdd) nb.disabled = true;
  nb.addEventListener('click', () => { const e = newEgg(); save.dragons.push(e); cur = e; undoStack = []; lairDlg.close(); persist(); setMode('care'); toast('A new egg! Keep it warm.'); });
  if (save.dragons.length < 8) grid.appendChild(nb);
  document.getElementById('lairnote').textContent = `${save.dragons.length} of ${slots} nest${slots === 1 ? '' : 's'} filled. Every 4 levels your dragons gain together, you find another egg.`;
  lairDlg.showModal();
  drawThumbs();
}
document.getElementById('lairbtn').addEventListener('click', openLair);
document.getElementById('lairclose').addEventListener('click', () => lairDlg.close());

window.addEventListener('pagehide', persist);
document.addEventListener('visibilitychange', () => { if (document.hidden) persist(); });

// ---------- boot ----------
resize();
setMode('care');
requestAnimationFrame(frame);
})();
</script>
