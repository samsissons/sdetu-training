<title>Golf Trip Leaderboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Cinzel:wght@600;700&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: a hand-operated tournament leaderboard. Green header band, white slotted board,
   red numbers for under par. One column on phones, wider board on desktop. */
:root{
  --bg:#e8eee5; --surface:#fbfcf8; --ink:#11241a; --muted:#56695d; --line:#d0dacc;
  --green:#134e36; --green-2:#1e6b4b; --on-green:#f4f8f2; --red:#c41230; --flag:#e3a514;
  --tile:#ffffff; --tile-line:#c6d1c2; --chip:#dce5d8; --good:#1e6b4b;
  --shadow:0 1px 0 rgba(17,36,26,.06), 0 8px 24px -12px rgba(17,36,26,.25);
  --f-display:"Big Shoulders Display","Oswald","Arial Narrow",Impact,sans-serif;
  --f-honours:"Cinzel","Trajan Pro",Georgia,serif;
  --wood:#4a2a17; --wood-2:#5e3820; --gilt:#d9b25c; --gilt-dim:#b8924a;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#08130d; --surface:#0f1f17; --ink:#e5eee7; --muted:#8ea396; --line:#1f3529;
  --green:#0e3926; --green-2:#2f8a62; --on-green:#eef6f0; --red:#ff5d6e; --flag:#f3c04a;
  --tile:#142a1f; --tile-line:#25412f; --chip:#1a3226; --good:#4cc58e;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08130d; --surface:#0f1f17; --ink:#e5eee7; --muted:#8ea396; --line:#1f3529;
  --green:#0e3926; --green-2:#2f8a62; --on-green:#eef6f0; --red:#ff5d6e; --flag:#f3c04a;
  --tile:#142a1f; --tile-line:#25412f; --chip:#1a3226; --good:#4cc58e;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.7); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--green)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--flag);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.inner{max-width:1000px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Header band */
.hero{background:var(--green);color:var(--on-green);margin-top:calc(-1 * env(safe-area-inset-top,0px));padding-top:calc(env(safe-area-inset-top,0px) + 22px);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 38px,transparent 38px 76px)}
.hero .inner{position:relative;z-index:1;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:0 18px}
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:600;opacity:.8;display:flex;align-items:center;gap:8px}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--flag);box-shadow:0 0 0 0 var(--flag);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(243,192,74,.6)}70%{box-shadow:0 0 0 8px rgba(243,192,74,0)}100%{box-shadow:0 0 0 0 rgba(243,192,74,0)}}
h1{font-family:var(--f-display);font-weight:900;text-transform:uppercase;font-size:clamp(40px,9vw,76px);line-height:.88;letter-spacing:.01em;margin:6px 0 0;text-wrap:balance}
.flag{display:inline-block;width:.42em;height:.62em;margin-left:.12em;vertical-align:.04em;position:relative}
.flag::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--on-green)}
.flag::after{content:"";position:absolute;left:3px;top:0;border-left:.36em solid var(--flag);border-top:.14em solid transparent;border-bottom:.14em solid transparent}
.hero-meta{font-size:13px;opacity:.85;text-align:right}
.hero-meta b{font-family:var(--f-display);font-size:28px;display:block;line-height:1;opacity:1;font-weight:800}

/* Tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--green);border-top:1px solid rgba(255,255,255,.1);box-shadow:0 6px 18px -12px rgba(0,0,0,.5)}
.tabs .inner{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tab{appearance:none;border:0;background:none;color:var(--on-green);opacity:.7;padding:12px 14px 11px;font-family:var(--f-display);font-weight:800;font-size:18px;letter-spacing:.06em;text-transform:uppercase;border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-current="page"]{opacity:1;border-bottom-color:var(--flag)}
.tab:hover{opacity:1}

main{padding-block:20px 80px}
.stack{display:flex;flex-direction:column;gap:18px}
.banner{background:var(--flag);color:#1d1704;border-radius:10px;padding:10px 14px;font-size:13px;font-weight:600;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner button{border:1.5px solid #1d1704;background:transparent;border-radius:999px;padding:4px 12px;font-weight:700;font-size:12px}

h2{font-family:var(--f-display);font-weight:800;text-transform:uppercase;font-size:26px;letter-spacing:.02em;margin:0;line-height:1}
h3{font-family:var(--f-display);font-weight:800;text-transform:uppercase;font-size:19px;letter-spacing:.03em;margin:0}
.sub{color:var(--muted);font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:12px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}

/* Round chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{flex:0 0 auto;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;text-align:left;min-width:150px}
.chip b{display:block;font-family:var(--f-display);font-size:17px;text-transform:uppercase;letter-spacing:.03em;font-weight:800}
.chip span{font-size:12px;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--green-2);background:var(--green);color:var(--on-green)}
.chip[aria-pressed="true"] span{color:var(--on-green);opacity:.8}
.status{display:inline-flex;align-items:center;gap:5px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--chip);color:var(--muted)}
.status.live{background:var(--red);color:#fff}
.status.final{background:var(--ink);color:var(--bg)}

/* Leaderboard */
.board{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;border:1px solid var(--line)}
.board-top{background:var(--green);color:var(--on-green);padding:12px 16px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.board-top h3{font-size:22px}
.board-top .sub{color:var(--on-green);opacity:.8}
.lb-cols,.lb-row{display:grid;grid-template-columns:44px minmax(0,1fr) 46px 74px;gap:8px;align-items:center;padding:0 12px}
.lb-cols{font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--muted);padding-block:8px;border-bottom:2px solid var(--line)}
.lb-cols span:nth-child(3),.lb-cols span:nth-child(4){text-align:center}
.lb-row{width:100%;border:0;background:none;text-align:left;padding-block:10px;border-bottom:1px solid var(--line)}
.lb-row:hover{background:color-mix(in srgb,var(--chip) 50%,transparent)}
.lb-row[aria-expanded="true"]{background:var(--chip)}
.pos{font-family:var(--f-display);font-weight:800;font-size:22px;text-align:center}
.who{min-width:0;display:flex;align-items:center;gap:10px}
.who > span:last-child{min-width:0}
.av{border-radius:50%;object-fit:cover;flex:0 0 auto;background:var(--chip);display:inline-grid;place-items:center;font-family:var(--f-display);font-weight:800;color:var(--green-2);overflow:hidden;text-transform:uppercase}
.avs{display:flex;flex:0 0 auto}
.avs .av+.av{margin-left:-10px;box-shadow:0 0 0 2px var(--surface)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;box-shadow:var(--shadow);min-width:0}
.pcard b{font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .nick{font-size:12px;color:var(--muted);font-style:italic;min-height:16px}
.pcard .need{font-size:11px;color:var(--red);font-weight:700;letter-spacing:.04em}
.pcard .stat{font-family:var(--f-display);font-weight:800;font-size:16px;text-transform:uppercase;letter-spacing:.04em}
.profile-hero{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.filebtn{position:relative;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:6px}
.mthumb{aspect-ratio:1;border-radius:8px;overflow:hidden;position:relative;border:0;padding:0;background:var(--chip);max-width:100%}
.mthumb img{width:100%;height:100%;object-fit:cover;display:block}
.mthumb .play{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.65);color:#fff;font-size:11px;padding:2px 8px;border-radius:999px;font-weight:700}
.lightbox{position:fixed;inset:0;z-index:60;background:rgba(4,10,7,.94);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 10px) max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 10px) max(12px,env(safe-area-inset-left,0px))}
.lightbox .stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.lightbox img,.lightbox video{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
.lightbox .bar{color:#f2f6f3;display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;flex-wrap:wrap}
.lightbox .bar small{opacity:.75}
.lbb{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:999px;padding:8px 14px;font-weight:700}
.lbb.del{background:rgba(255,93,110,.25)}
.honours{border-radius:14px;padding:22px 18px 26px;color:var(--gilt);box-shadow:var(--shadow),inset 0 0 0 6px rgba(0,0,0,.18),inset 0 0 0 8px var(--gilt-dim);
  background:linear-gradient(180deg,rgba(255,255,255,.06),transparent 30%,rgba(0,0,0,.18)),repeating-linear-gradient(92deg,var(--wood) 0 7px,var(--wood-2) 7px 9px,var(--wood) 9px 19px,#432514 19px 21px)}
.honours h2{font-family:var(--f-honours);font-weight:700;text-align:center;font-size:clamp(22px,6vw,34px);letter-spacing:.12em;color:var(--gilt);text-shadow:0 1px 0 rgba(0,0,0,.5)}
.honours .rule{height:2px;background:linear-gradient(90deg,transparent,var(--gilt),transparent);margin:12px auto 16px;max-width:320px}
.hrow{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 4px;border-bottom:1px solid rgba(217,178,92,.22);font-family:var(--f-honours);text-shadow:0 1px 0 rgba(0,0,0,.5)}
.hrow:last-child{border-bottom:0}
.hrow .yr{font-size:22px;font-weight:700;font-variant-numeric:lining-nums tabular-nums}
.hrow .nm{font-size:19px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;min-width:0;overflow-wrap:anywhere}
.hrow .nm small{white-space:normal;overflow:visible;display:block;font-family:var(--f-body);font-size:12px;letter-spacing:.02em;text-transform:none;color:#e9d9b4;opacity:.85;font-weight:500;text-shadow:none}
.hrow .tbd{opacity:.7;font-style:italic}
.hrow .ed{font-family:var(--f-body);background:rgba(0,0,0,.25);color:var(--gilt);border:1px solid rgba(217,178,92,.4);border-radius:8px;padding:4px 10px;font-size:12px;font-weight:700;text-shadow:none}
.spoon{font-family:var(--f-body);font-size:12px;color:#e9d9b4;opacity:.85}
@media (max-width:520px){.hrow{grid-template-columns:58px minmax(0,1fr) auto}.hrow .yr{font-size:19px}.hrow .nm{font-size:16px}}
.nudge{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border:1.5px dashed var(--green-2);border-radius:12px;padding:10px 14px;font-size:13px;font-weight:600}
.who b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thru{text-align:center;font-weight:600;color:var(--muted);font-size:13px}
.tile{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1;text-align:center;background:var(--tile);border:1.5px solid var(--tile-line);border-radius:6px;padding:6px 0 5px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.06)}
.tile.under{color:var(--red)}
.tile.dim{color:var(--muted)}
.tile small{display:block;font-family:var(--f-body);font-size:9px;letter-spacing:.14em;font-weight:700;color:var(--muted);margin-top:1px}
.tile.flash{animation:flash 1.4s ease-out}
@keyframes flash{0%{background:var(--flag)}100%{background:var(--tile)}}
.lb-card{padding:12px;border-bottom:1px solid var(--line);background:var(--chip)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

/* Scorecard grid */
.sc-wrap{overflow-x:auto;background:var(--surface);border-radius:10px;border:1px solid var(--line)}
table.sc{border-collapse:collapse;font-size:13px;min-width:100%}
.sc th,.sc td{padding:5px 4px;text-align:center;min-width:28px;border-right:1px solid var(--line)}
.sc th:first-child,.sc td:first-child{text-align:left;padding-left:10px;min-width:92px;position:sticky;left:0;background:var(--surface);font-weight:600;white-space:nowrap}
.sc thead th{font-size:10px;letter-spacing:.1em;color:var(--muted);font-weight:700;border-bottom:1px solid var(--line)}
.sc .tot{font-weight:800;background:var(--chip)}
.sc tr.parrow td{color:var(--muted)}
.mk{display:inline-grid;place-items:center;width:24px;height:24px;font-weight:700;font-variant-numeric:tabular-nums}
.mk.b1{border:1.5px solid var(--red);border-radius:50%;color:var(--red)}
.mk.b2{border:1.5px solid var(--red);border-radius:50%;color:var(--red);box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--red)}
.mk.o1{border:1.5px solid var(--muted)}
.mk.o2{border:1.5px solid var(--muted);box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--muted)}
.mk.pu{color:var(--muted)}
.skin{color:var(--flag);font-weight:900}

/* Score entry */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.picker{display:flex;flex-wrap:wrap;gap:8px}
.pick{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-weight:600;font-size:14px}
.chips .pick{flex:0 0 auto;white-space:nowrap}
.pick[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--on-green)}
.holes{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:5px}
.hole-btn{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 0;font-family:var(--f-display);font-weight:800;font-size:17px}
.hole-btn.done{background:var(--chip);border-color:var(--chip)}
.hole-btn[aria-current="true"]{background:var(--green);color:var(--on-green);border-color:var(--green)}
.hole-card{background:var(--green);color:var(--on-green);border-radius:14px;padding:16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.hole-card .big{font-family:var(--f-display);font-weight:900;font-size:64px;line-height:.85}
.hole-card .big small{font-size:18px;letter-spacing:.12em;display:block;opacity:.8}
.hole-facts{display:flex;gap:16px;text-align:center}
.hole-facts div b{display:block;font-family:var(--f-display);font-size:34px;line-height:1;font-weight:800}
.hole-facts div span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:.8;font-weight:700}
.entry{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.entry:last-child{border-bottom:0}
.entry .nm b{display:block;font-weight:700}
.entry .nm small{color:var(--muted);font-size:12px}
.dots{display:inline-flex;gap:3px;vertical-align:middle;margin-left:4px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--flag);display:inline-block}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:44px;height:48px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:24px;font-weight:600;line-height:1}
.stepper .val{width:60px;height:56px;border-radius:10px;border:2px solid var(--green-2);background:var(--tile);font-family:var(--f-display);font-weight:900;font-size:34px;display:grid;place-items:center}
.stepper .val.under{color:var(--red)}
.stepper .val.unset{color:var(--muted);border-style:dashed;border-color:var(--line);font-size:16px;font-family:var(--f-body);font-weight:600}
.stepper .pu{width:auto;padding:0 10px;font-size:13px;font-weight:700}
.stepper .pu[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.result{font-size:12px;font-weight:700;color:var(--muted);text-align:right;min-height:16px}
.result.good{color:var(--red)}
.navrow{display:flex;gap:10px}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px;font-weight:700}
.btn.primary{background:var(--green);border-color:var(--green);color:var(--on-green)}
.btn.flagb{background:var(--flag);border-color:var(--flag);color:#1d1704}
.btn.danger{color:var(--red)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.navrow .btn{flex:1;padding:14px}

/* Trip standings */
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:end}
.pod{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 10px;text-align:center;box-shadow:var(--shadow);min-width:0}
.pod .rk{font-family:var(--f-display);font-weight:900;font-size:44px;line-height:.9;color:var(--muted)}
.pod.p1{background:var(--green);color:var(--on-green);border-color:var(--green);padding-block:22px}
.pod.p1 .rk{color:var(--flag);font-size:60px}
.pod b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pod .pts{font-family:var(--f-display);font-weight:800;font-size:24px}
.p1-wrap{order:2}.p2-wrap{order:1}.p3-wrap{order:3}
.tbl-wrap{overflow-x:auto}
table.st{width:100%;border-collapse:collapse;font-size:14px}
.st th{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:center;padding:8px 6px;border-bottom:2px solid var(--line);white-space:nowrap}
.st td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:center}
.st th:nth-child(2),.st td:nth-child(2){text-align:left}
.st td.total{font-family:var(--f-display);font-weight:800;font-size:22px}
.st td.rk{font-family:var(--f-display);font-weight:800;font-size:19px}
.st .prov{color:var(--muted);font-style:italic}

/* Setup */
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.inp{border:1.5px solid var(--line);background:var(--tile);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
.inp:focus{border-color:var(--green-2);outline:none}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.plist{display:flex;flex-direction:column;gap:6px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 90px 40px;gap:8px;align-items:center}
.iconbtn{width:40px;height:38px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);font-size:18px}
.course{overflow-x:auto}
.course table{border-collapse:collapse}
.course td,.course th{padding:2px;text-align:center;font-size:11px;color:var(--muted)}
.course input{width:38px;text-align:center;padding:5px 2px;border:1.5px solid var(--line);border-radius:6px;background:var(--tile)}
.course input.bad{border-color:var(--red)}
.rcard{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.rcard > button{width:100%;border:0;background:none;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left}
.rbody{padding:0 16px 16px;display:flex;flex-direction:column;gap:16px;border-top:1px solid var(--line);padding-top:16px}
.fmt-desc{background:var(--chip);border-radius:10px;padding:10px 12px;font-size:13px}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.team{border:1.5px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px}
.team ul{margin:0;padding:0;list-style:none;font-size:13px}
.assign{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px 12px}
.assign label{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px}
.assign select{max-width:110px}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px}

.toasts{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:8px;z-index:50;pointer-events:none;padding-inline:16px}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;box-shadow:var(--shadow);animation:tin .3s ease-out}
.toast.birdie{background:var(--red);color:#fff}
@keyframes tin{from{transform:translateY(12px);opacity:0}}
.formats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.formats div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.formats p{margin:6px 0 0;font-size:13px;color:var(--muted)}
@media (max-width:520px){
  .lb-cols,.lb-row{grid-template-columns:34px minmax(0,1fr) 38px 62px;padding:0 10px;gap:6px}
  .tile{font-size:24px}
  .hole-card .big{font-size:52px}
  .hole-facts{gap:10px}
  .hero-meta{text-align:left}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

<div id="lightbox"></div>

<script>
(() => {
'use strict';
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => p + Math.random().toString(36).slice(2, 9);
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

const DEFAULT_PAR = [4,4,3,5,4,4,3,4,5, 4,3,5,4,4,4,3,5,4];
const DEFAULT_SI  = [7,1,15,11,3,9,17,5,13, 8,16,12,2,6,10,18,14,4];
const DEFAULT_POINTS = [10,8,6,5,4,3,2,1];

const FORMATS = {
  stableford: { name: 'Stableford', short: 'Stableford', team: false, allowance: 1, pickup: true, unit: 'pts',
    desc: 'Individual. Points on every hole against your nett par: 1 for a nett bogey, 2 for nett par, 3 for a nett birdie, 4 for a nett eagle. Pick up once you can\'t score. Most points wins.' },
  stroke: { name: 'Nett Stroke Play', short: 'Stroke', team: false, allowance: 1, pickup: false, unit: 'nett',
    desc: 'Individual. Every shot counts and you hole out on every hole. Gross score minus your handicap. Lowest nett score wins.' },
  ambrose: { name: 'Ambrose', short: 'Ambrose', team: true, teamScore: true, allowance: 1, pickup: false, unit: 'nett',
    desc: 'Team scramble. Everyone tees off, the team picks the best shot and all play from there, all the way into the hole. One score per team per hole. Team handicap is the combined handicaps divided by twice the team size (pairs ÷ 4, threes ÷ 6, fours ÷ 8).' },
  fourbbb: { name: 'Best Ball Stableford', short: 'Best Ball', team: true, teamScore: false, allowance: 0.9, pickup: true, unit: 'pts',
    desc: 'Pairs. Both players play their own ball and score Stableford at 90% of handicap. The better score of the two counts on each hole. Most team points wins.' },
  skins: { name: 'Skins', short: 'Skins', team: false, allowance: 1, pickup: true, unit: 'skins',
    desc: 'Individual. Every hole is worth a skin. Win the hole outright on nett score and you take it. Any tie and the skin carries over to the next hole, so they stack up.' },
};

const S = {
  mode: 'loading', db: null, user: null, canEdit: false, canWrite: true, demo: false, realEmpty: false,
  trip: { name: '', points: DEFAULT_POINTS }, players: {}, rounds: {}, scores: {}, media: {}, winners: {},
  loaded: {}, view: 'board', boardRound: null, scoreRound: null, open: {}, editRound: null, hole: {},
  flash: new Set(), real: null,
};

/* ---------- golf maths ---------- */
const sortedRounds = () => Object.values(S.rounds).sort((a, b) => (a.order ?? 0) - (b.order ?? 0) || String(a.date || '').localeCompare(String(b.date || '')) || String(a.name).localeCompare(String(b.name)));
const pname = pid => S.players[pid]?.name || 'Player';
const firstName = pid => pname(pid).split(' ')[0];
const sortedPlayers = () => Object.values(S.players).sort((a, b) => String(a.name).localeCompare(String(b.name)));
const fmt = r => FORMATS[r?.format] || FORMATS.stableford;
function course(r) { return { par: Array.isArray(r.par) && r.par.length === 18 ? r.par.map(Number) : DEFAULT_PAR, si: Array.isArray(r.si) && r.si.length === 18 ? r.si.map(Number) : DEFAULT_SI }; }
function baseH(r, pid) { const o = r.hcp?.[pid]; const v = (o !== undefined && o !== null && o !== '') ? Number(o) : Number(S.players[pid]?.hcp ?? 0); return isFinite(v) ? v : 0; }
function phcp(r, pid) { return Math.round(baseH(r, pid) * fmt(r).allowance); }
function ambroseHcp(r, members) { if (!members.length) return 0; return Math.round(members.reduce((s, p) => s + baseH(r, p), 0) / (2 * members.length)); }
function shots(ph, si) {
  if (ph >= 0) return Math.floor(ph / 18) + (si <= ph % 18 ? 1 : 0);
  const a = -ph; return -(Math.floor(a / 18) + ((19 - si) <= a % 18 ? 1 : 0));
}
const stbl = (par, g, s) => g === 'P' ? 0 : Math.max(0, 2 + par + s - g);
const toPar = v => v === 0 ? 'E' : (v > 0 ? '+' + v : String(v));
function roundPlayers(r) {
  const f = fmt(r);
  if (f.team) return [...new Set((r.teams || []).flatMap(t => t.playerIds || []))].filter(id => S.players[id]);
  const ids = Array.isArray(r.playerIds) && r.playerIds.length ? r.playerIds : sortedPlayers().map(p => p.id);
  return ids.filter(id => S.players[id]);
}
function teamLabel(members, i) { return members.length ? members.map(firstName).join(' & ') : 'Team ' + (i + 1); }
function units(r) {
  const f = fmt(r);
  if (f.team) return (r.teams || []).map((t, i) => {
    const members = (t.playerIds || []).filter(id => S.players[id]);
    return { id: t.id, name: t.name || teamLabel(members, i), members, keys: f.teamScore ? [t.id] : members, hcp: f.teamScore ? ambroseHcp(r, members) : null };
  }).filter(u => u.members.length);
  return roundPlayers(r).map(pid => ({ id: pid, name: pname(pid), members: [pid], keys: [pid], hcp: phcp(r, pid) }));
}
/* entities = who a scorer types a number for */
function entities(r) {
  const f = fmt(r);
  if (f.teamScore) return units(r).map(u => ({ key: u.id, name: u.name, sub: u.members.map(firstName).join(', '), hcp: u.hcp }));
  const teamOf = {};
  if (f.team) units(r).forEach(u => u.members.forEach(m => teamOf[m] = u.name));
  return roundPlayers(r).map(pid => ({ key: pid, name: pname(pid), sub: teamOf[pid] ? 'Team ' + teamOf[pid] : '', hcp: phcp(r, pid) }));
}
const docId = (r, key) => r.id + '__' + key;
function gv(r, key, h) { const v = S.scores[docId(r, key)]?.holes?.[h]; return (v === 'P' || (typeof v === 'number' && v > 0)) ? v : null; }

function compute(r) {
  const f = fmt(r), C = course(r), us = units(r);
  const rows = us.map(u => {
    let thru = 0, pts = 0, rel = 0, gross = 0, holes = [];
    for (let h = 1; h <= 18; h++) {
      const par = C.par[h - 1], si = C.si[h - 1];
      if (r.format === 'fourbbb') {
        const vals = u.members.map(pid => { const g = gv(r, pid, h); return g == null ? null : { pid, g, p: stbl(par, g, shots(phcp(r, pid), si)) }; });
        if (vals.length && vals.every(Boolean)) { thru++; const best = Math.max(...vals.map(v => v.p)); pts += best; holes.push({ best, vals }); }
        else holes.push(null);
        continue;
      }
      const g = gv(r, u.keys[0], h); const s = shots(u.hcp, si);
      if (g == null) { holes.push(null); continue; }
      thru++;
      const p = stbl(par, g, s);
      if (g !== 'P') { gross += g; rel += (g - s) - par; }
      pts += p; holes.push({ g, s, p, nett: g === 'P' ? Infinity : g - s, par });
    }
    return { unit: u, thru, pts, rel, gross, holes, skins: 0 };
  });
  let carry = 0; const skinHoles = {};
  if (r.format === 'skins' && rows.length > 1) {
    for (let h = 0; h < 18; h++) {
      if (!rows.every(x => x.holes[h])) break;
      const nets = rows.map(x => x.holes[h].nett), min = Math.min(...nets);
      const winners = rows.filter(x => x.holes[h].nett === min);
      carry++;
      if (winners.length === 1 && min !== Infinity) { winners[0].skins += carry; skinHoles[h] = { id: winners[0].unit.id, n: carry }; carry = 0; }
    }
  }
  const val = x => {
    if (!x.thru) return null;
    if (r.format === 'stableford' || r.format === 'fourbbb') return -x.pts;
    if (r.format === 'skins') return -x.skins;
    return x.rel;
  };
  rows.sort((a, b) => {
    const va = val(a), vb = val(b);
    if (va == null && vb == null) return a.unit.name.localeCompare(b.unit.name);
    if (va == null) return 1; if (vb == null) return -1;
    return va - vb || (r.format === 'skins' ? a.rel - b.rel : 0) || b.thru - a.thru;
  });
  rows.forEach(x => { const v = val(x); x.pos = v == null ? null : 1 + rows.filter(y => val(y) != null && val(y) < v).length; });
  rows.forEach(x => { x.tied = x.pos != null && rows.filter(y => y.pos === x.pos).length > 1; });
  return { rows, carry, skinHoles, started: rows.some(x => x.thru) };
}

function scoreTile(r, x) {
  if (!x.thru) return { text: '–', cls: 'dim', label: fmt(r).unit };
  if (r.format === 'stableford' || r.format === 'fourbbb') return { text: x.pts, cls: x.pts - 2 * x.thru > 0 ? 'under' : '', label: 'pts' };
  if (r.format === 'skins') return { text: x.skins, cls: x.skins ? 'under' : '', label: x.skins === 1 ? 'skin' : 'skins' };
  return { text: toPar(x.rel), cls: x.rel < 0 ? 'under' : '', label: 'nett' };
}

function tripStandings() {
  const table = (S.trip.points && S.trip.points.length ? S.trip.points : DEFAULT_POINTS).map(Number);
  const res = {};
  sortedPlayers().forEach(p => res[p.id] = { pid: p.id, total: 0, by: {}, sides: 0 });
  const rounds = sortedRounds();
  rounds.forEach(r => {
    const c = compute(r);
    if (c.started) {
      const groups = {};
      c.rows.forEach(x => { if (x.pos != null) (groups[x.pos] ||= []).push(x); });
      Object.entries(groups).forEach(([pos, xs]) => {
        const p0 = Number(pos) - 1; let sum = 0;
        for (let i = 0; i < xs.length; i++) sum += table[p0 + i] || 0;
        const each = Math.round(sum / xs.length * 10) / 10;
        xs.forEach(x => x.unit.members.forEach(m => { if (res[m]) { res[m].by[r.id] = each; res[m].total += each; } }));
      });
    }
    (r.sides || []).forEach(sd => { if (sd.winner && res[sd.winner]) { const v = Number(sd.points) || 0; res[sd.winner].sides += v; res[sd.winner].total += v; } });
  });
  const list = Object.values(res).map(x => ({ ...x, total: Math.round(x.total * 10) / 10 })).sort((a, b) => b.total - a.total || pname(a.pid).localeCompare(pname(b.pid)));
  list.forEach(x => x.pos = 1 + list.filter(y => y.total > x.total).length);
  return { list, rounds };
}

/* ---------- data layer ---------- */
const pendingScores = {}; const flushTimers = {}; const docQueue = {};
function serial(path, fn) { docQueue[path] = (docQueue[path] || Promise.resolve()).then(fn).catch(e => { toast(writeErr(e)); }); return docQueue[path]; }
function writeErr(e) { return e?.code === 'not_granted' ? 'You can view but not change this trip. Ask the organiser for edit access.' : 'Could not save. Check your connection and try again.'; }
async function setDoc(path, data) {
  if (S.demo) { demoApply(path, data, false); return; }
  return serial(path, () => S.db.doc(path).set(data));
}
async function updateDoc(path, data) {
  if (S.demo) { demoApply(path, data, true); return; }
  return serial(path, () => S.db.doc(path).update(data));
}
async function delDoc(path) {
  if (S.demo) { const [c, id] = path.split('/'); delete S[c][id]; render(); return; }
  return serial(path, () => S.db.doc(path).delete());
}
function demoApply(path, data, merge) {
  const [c, id] = path.split('/');
  if (c === 'trip') { S.trip = merge ? { ...S.trip, ...data } : data; render(); return; }
  const cur = S[c][id];
  if (merge && cur) { const n = { ...cur }; for (const k in data) n[k] = (data[k] && typeof data[k] === 'object' && !Array.isArray(data[k]) && cur[k] && typeof cur[k] === 'object') ? { ...cur[k], ...data[k] } : data[k]; S[c][id] = n; }
  else S[c][id] = { id, ...data };
  render();
}
function setHole(r, key, h, v) {
  const id = docId(r, key);
  const cur = S.scores[id] || { id, roundId: r.id, key, holes: {} };
  S.scores[id] = { ...cur, holes: { ...cur.holes, [h]: v } };
  if (S.demo) { render(); return; }
  (pendingScores[id] ||= {})[h] = v;
  clearTimeout(flushTimers[id]);
  flushTimers[id] = setTimeout(() => flush(id, r.id, key), 450);
  render();
}
function flush(id, roundId, key) {
  const holes = pendingScores[id]; delete pendingScores[id]; if (!holes) return;
  const path = 'scores/' + id;
  serial(path, async () => {
    const ref = S.db.doc(path); const snap = await ref.get();
    if (snap.exists) await ref.update({ holes });
    else await ref.set({ roundId, key, holes });
  });
}

function subscribe(timer) {
  let first = true;
  const done = (k) => { S.loaded[k] = 1; if (['trip', 'players', 'rounds', 'scores'].every(x => S.loaded[x])) { clearTimeout(timer); if (S.mode === 'loading') S.mode = 'live'; } render(); };
  const onErr = (e) => { clearTimeout(timer); S.mode = 'offline'; S.err = e?.message; render(); };
  const intoMap = snap => Object.fromEntries(snap.docs.map(d => [d.id, { id: d.id, ...d.data() }]));
  S.db.doc('trip/main').onSnapshot(s => { const d = s.exists ? s.data() : {}; S.real = S.real || {}; S.real.trip = { name: d.name || '', points: d.points || DEFAULT_POINTS, ...(d.pinHash ? { pinHash: d.pinHash } : {}) }; if (S.backend === 'firebase') S.canEdit = !!d.pinHash && LS.get('golf.pin', '') === d.pinHash; if (!S.demo) S.trip = S.real.trip; done('trip'); }, onErr);
  S.db.collection('players').onSnapshot(s => { S.real = S.real || {}; S.real.players = intoMap(s); if (!S.demo) S.players = S.real.players; done('players'); }, onErr);
  S.db.collection('rounds').onSnapshot(s => { S.real = S.real || {}; S.real.rounds = intoMap(s); if (!S.demo) S.rounds = S.real.rounds; done('rounds'); }, onErr);
  S.db.collection('winners').onSnapshot(s => { S.real = S.real || {}; S.real.winners = intoMap(s); if (!S.demo) S.winners = S.real.winners; render(); }, () => {});
  S.db.collection('media').onSnapshot(s => { S.real = S.real || {}; S.real.media = intoMap(s); if (!S.demo) S.media = S.real.media; render(); }, () => {});
  S.db.collection('scores').onSnapshot(s => {
    const next = intoMap(s);
    // keep un-flushed local edits on top of incoming data
    for (const id in pendingScores) if (next[id]) next[id] = { ...next[id], holes: { ...next[id].holes, ...pendingScores[id] } };
    if (!first && !S.demo) announce(S.scores, next);
    first = false;
    S.real = S.real || {}; S.real.scores = next; if (!S.demo) S.scores = next; done('scores');
  }, onErr);
}
function announce(prev, next) {
  for (const id in next) {
    const r = S.rounds[next[id].roundId]; if (!r) continue;
    const C = course(r); const a = prev[id]?.holes || {}, b = next[id].holes || {};
    for (const h in b) {
      if (a[h] === b[h] || typeof b[h] !== 'number') continue;
      const diff = b[h] - C.par[h - 1];
      const key = next[id].key; const who = S.players[key] ? pname(key) : (units(r).find(u => u.id === key)?.name || 'A team');
      if (diff <= -1) toast(`${who} ${diff <= -3 ? 'albatross' : diff === -2 ? (b[h] === 1 ? 'hole in one' : 'eagle') : 'birdie'} on ${h}!`, 'birdie');
      units(r).forEach(u => { if (u.keys.includes(key)) S.flash.add(r.id + ':' + u.id); });
    }
  }
}

/* ---------- sample trip (local only) ---------- */
function sampleTrip() {
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const names = [['Dazza Kerr', 8], ['Mick Ralston', 14], ['Robbo Nguyen', 22], ['Johnno Price', 11], ['Hendo Walsh', 18], ['Davo Singh', 5], ['Smithy Lane', 27], ['Tommo Ford', 16], ['Gaz Moretti', 12], ['Kev Byrne', 20], ['Lachy Ward', 9], ['Fitzy Cole', 24]];
  const players = {}; names.forEach(([n, h], i) => { const id = 'px' + i; players[id] = { id, name: n, hcp: h }; });
  const ids = Object.keys(players);
  const parA = DEFAULT_PAR, parB = [5,4,3,4,4,5,3,4,4, 4,4,3,5,4,3,4,5,4], parC = [4,3,5,4,4,3,4,5,4, 4,5,3,4,4,3,4,4,5];
  const rounds = {
    rs1: { id: 'rs1', order: 1, name: 'Round 1', course: 'Sandy Creek Links', date: 'Fri', format: 'ambrose', status: 'final', par: parA, si: DEFAULT_SI,
      teams: [{ id: 'ts1', name: 'Sandbaggers', playerIds: [ids[0], ids[2], ids[7], ids[9]] }, { id: 'ts2', name: 'Grip It & Sip It', playerIds: [ids[5], ids[6], ids[3], ids[4]] }, { id: 'ts3', name: 'Shanks a Lot', playerIds: [ids[10], ids[11], ids[8], ids[1]] }],
      sides: [{ id: 'sd1', label: 'Nearest the pin #7', winner: ids[3], points: 2 }, { id: 'sd2', label: 'Longest drive #4', winner: ids[5], points: 2 }] },
    rs2: { id: 'rs2', order: 2, name: 'Round 2', course: 'Ridgeline Golf Club', date: 'Sat', format: 'fourbbb', status: 'live', par: parB, si: [9,3,17,1,11,7,15,5,13, 10,4,18,8,2,16,12,6,14],
      teams: [[0, 6], [5, 11], [10, 2], [3, 9], [8, 4], [1, 7]].map((p, i) => ({ id: 'tb' + i, name: '', playerIds: p.map(k => ids[k]) })),
      sides: [{ id: 'sd3', label: 'Nearest the pin #3', winner: ids[11], points: 2 }] },
    rs3: { id: 'rs3', order: 3, name: 'Round 3', course: 'Ironbark Valley', date: 'Sun', format: 'stableford', status: 'upcoming', par: parC, si: DEFAULT_SI, sides: [] },
  };
  const scores = {};
  const play = (r, key, hcp, upto, skill) => {
    const C = course(r); const holes = {};
    for (let h = 1; h <= upto; h++) {
      const par = C.par[h - 1]; const s = shots(hcp, C.si[h - 1]);
      let g = par + Math.round((rnd() * 2.4 - 1.1) + s * skill);
      if (g < 2) g = 2; holes[h] = g;
    }
    scores[r.id + '__' + key] = { id: r.id + '__' + key, roundId: r.id, key, holes };
  };
  S.players = players; S.rounds = rounds;
  rounds.rs1.teams.forEach(t => play(rounds.rs1, t.id, ambroseHcp(rounds.rs1, t.playerIds), 18, -0.1));
  const thruR2 = [11, 12, 10, 11, 9, 12];
  rounds.rs2.teams.forEach((t, i) => t.playerIds.forEach(pid => play(rounds.rs2, pid, Math.round(players[pid].hcp * .9), thruR2[i], 0.85)));
  const winners = {
    w1: { id: 'w1', year: '2025', champion: 'Johnno Price', venue: 'Barwon Heads & 13th Beach', note: '41 points', runnerUp: 'Davo Singh', spoon: 'Smithy Lane' },
    w2: { id: 'w2', year: '2024', champion: 'Gaz Moretti', venue: 'Yarra Valley', note: '', runnerUp: 'Dazza Kerr', spoon: 'Robbo Nguyen' },

function cardBlock(r, x, c, showRound) {

function viewCards() {
  const rs = sortedRounds(); if (!rs.length) return welcome();
  const who = S.cardPlayer && S.players[S.cardPlayer] ? S.cardPlayer : '';
  const picker = `<div class="field" style="max-width:260px"><label for="cardWho">Show</label><select class="inp" id="cardWho">
    <option value="">Everyone, one round at a time</option>${sortedPlayers().map(p => `<option value="${p.id}" ${p.id === who ? 'selected' : ''}>${esc(p.name)}: all rounds</option>`).join('')}</select></div>`;
  let body;
  if (who) {
    body = rs.map(r => { const c = compute(r); const x = c.rows.find(x => x.unit.members.includes(who)); return x ? cardBlock(r, x, c, true) : ''; }).join('')

function mark(g, par) {
  if (g == null) return '';
  if (g === 'P') return '<span class="mk pu">–</span>';
  const d = g - par; const cls = d <= -2 ? 'b2' : d === -1 ? 'b1' : d === 1 ? 'o1' : d >= 2 ? 'o2' : '';
  return `<span class="mk ${cls}">${g}</span>`;
}
function scorecard(r, x, c) {
  const C = course(r); const f = fmt(r);
  const head = `<tr><th>Hole</th>${[...Array(9)].map((_, i) => `<th>${i + 1}</th>`).join('')}<th class="tot">Out</th>${[...Array(9)].map((_, i) => `<th>${i + 10}</th>`).join('')}<th class="tot">In</th><th class="tot">Tot</th></tr>`;
  const line = (label, fn, sumFn, cls = '') => {
    const cells = []; let out = 0, inn = 0, any = [false, false];
    for (let h = 0; h < 18; h++) { const { html, v } = fn(h); cells.push(`<td>${html}</td>`); if (typeof v === 'number') { if (h < 9) { out += v; any[0] = true; } else { inn += v; any[1] = true; } } }
    const s = sumFn !== false;
    return `<tr class="${cls}"><td>${esc(label)}</td>${cells.slice(0, 9).join('')}<td class="tot">${s && any[0] ? out : ''}</td>${cells.slice(9).join('')}<td class="tot">${s && any[1] ? inn : ''}</td><td class="tot">${s && (any[0] || any[1]) ? out + inn : ''}</td></tr>`;
  };
  const rows = [line('Par', h => ({ html: C.par[h], v: C.par[h] }), true, 'parrow'), line('Index', h => ({ html: C.si[h] }), false, 'parrow')];
  if (r.format === 'fourbbb') {
    x.unit.members.forEach(pid => rows.push(line(firstName(pid) + ` (${phcp(r, pid)})`, h => { const g = gv(r, pid, h + 1); return { html: mark(g, C.par[h]), v: typeof g === 'number' ? g : undefined }; })));
    rows.push(line('Best pts', h => { const o = x.holes[h]; return { html: o ? `<b>${o.best}</b>` : '', v: o ? o.best : undefined }; }));
  } else {
    rows.push(line(f.teamScore ? 'Team gross' : 'Gross', h => { const o = x.holes[h]; return { html: o ? mark(o.g, o.par) : '', v: o && typeof o.g === 'number' ? o.g : undefined }; }));
    if (r.format === 'stroke' || r.format === 'ambrose') rows.push(line('Nett', h => { const o = x.holes[h]; return { html: o && o.nett !== Infinity ? o.nett : '', v: o && o.nett !== Infinity ? o.nett : undefined }; }));
    if (r.format === 'stableford' || r.format === 'skins') rows.push(line('Points', h => { const o = x.holes[h]; return { html: o ? o.p : '', v: o ? o.p : undefined }; }));
    if (r.format === 'skins') rows.push(line('Skins', h => { const w = c.skinHoles[h]; return { html: w && w.id === x.unit.id ? `<span class="skin">${w.n}</span>` : '' }; }, false));
  }
  return `<div class="sc-wrap"><table class="sc num"><thead>${head}</thead><tbody>${rows.join('')}</tbody></table></div>
    <div class="sub" style="margin-top:8px">Circles are under par, squares over. ${f.teamScore ? `Team handicap ${x.unit.hcp}. ` : ''}${x.thru && r.format !== 'fourbbb' ? `Gross ${x.gross} through ${x.thru}.` : ''}</div>`;
}

function viewScore() {
  const rs = sortedRounds(); if (!rs.length) return welcome();
  S.scoreRound = pickRound(S.scoreRound);
  const r = S.rounds[S.scoreRound]; const f = fmt(r); const C = course(r);
  const ents = entities(r);
  const selKey = 'golf.sel.' + r.id;
  let sel = (LS.get(selKey, null) || S['sel_' + r.id] || []).filter(k => ents.some(e => e.key === k));
  const pickerOpen = !sel.length || S.pickOpen;
  const ro = !S.canWrite && !S.demo;
  let hole = S.hole[r.id];
  if (!hole) { hole = 1; for (let h = 1; h <= 18; h++) { if (sel.some(k => gv(r, k, h) == null)) { hole = h; break; } } }
  if (sel.length) S.hole[r.id] = hole;
  const par = C.par[hole - 1], si = C.si[hole - 1];
  const holesNav = [...Array(18)].map((_, i) => { const h = i + 1; const done = sel.length && sel.every(k => gv(r, k, h) != null); return `<button class="hole-btn num ${done ? 'done' : ''}" data-act="hole" data-id="${h}" aria-current="${h === hole}">${h}</button>`; }).join('');
  const entries = sel.map(k => {
    const e = ents.find(x => x.key === k); const g = gv(r, k, hole); const s = shots(e.hcp, si);
    let res = '';
    if (g === 'P') res = 'Picked up · 0 pts';
    else if (g != null) {
      const d = g - par; const names = { '-3': 'Albatross', '-2': 'Eagle', '-1': 'Birdie', '0': 'Par', '1': 'Bogey', '2': 'Double' };
      res = (g === 1 ? 'Hole in one' : names[d] || (d > 0 ? '+' + d : d)) + (f.pickup || r.format === 'stroke' || f.teamScore ? ` · nett ${g - s}` : '');
      if (r.format === 'stableford' || r.format === 'fourbbb' || r.format === 'skins') res += ` · ${stbl(par, g, s)} pts`;
    }
    const dots = s > 0 ? `<span class="dots" title="${s} shot${s > 1 ? 's' : ''}">${'<i></i>'.repeat(Math.min(s, 3))}</span>` : '';
    return `<div class="entry">
      <div class="nm"><b>${esc(e.name)}${dots}</b><small>${esc(e.sub || '')}${e.sub ? ' · ' : ''}hcp ${e.hcp}${s ? ` · gets ${s} shot${s > 1 ? 's' : ''} here` : ''}</small>
        <div class="result ${typeof g === 'number' && g < par ? 'good' : ''}" style="text-align:left">${esc(res)}</div></div>
      <div class="stepper">
        <button aria-label="One less" data-act="dec" data-id="${esc(k)}" ${ro ? 'disabled' : ''}>−</button>
        <button class="val num ${g == null ? 'unset' : ''} ${typeof g === 'number' && g < par ? 'under' : ''}" data-act="setpar" data-id="${esc(k)}" ${ro ? 'disabled' : ''} aria-label="Score">${g == null ? 'Tap' : g === 'P' ? 'P' : g}</button>
        <button aria-label="One more" data-act="inc" data-id="${esc(k)}" ${ro ? 'disabled' : ''}>+</button>
        ${f.pickup ? `<button class="pu" data-act="pickup" data-id="${esc(k)}" aria-pressed="${g === 'P'}" ${ro ? 'disabled' : ''}>Pick up</button>` : ''}
      </div></div>`;
  }).join('');
  return `<div class="stack">${demoBanner()}
    ${roundChips(r.id, 'scoreRound')}
    ${ro ? '<div class="banner"><span>You can follow along, but only people with edit access can enter scores. Ask the organiser.</span></div>' : ''}
    <section class="panel">
      <div class="spread"><div><h3>Who are you scoring?</h3><div class="sub">${f.teamScore ? 'Ambrose has one score per team.' : 'Pick everyone in your group. One person can keep the card for the whole group.'}</div></div>
      ${!pickerOpen ? `<button class="btn sm" data-act="pickOpen">Change</button>` : ''}</div>
      ${pickerOpen ? `<div class="picker" style="margin-top:12px">${ents.map(e => `<button class="pick" data-act="pick" data-id="${esc(e.key)}" aria-pressed="${sel.includes(e.key)}">${esc(e.name)}</button>`).join('') || '<span class="sub">Nobody is in this round yet.</span>'}</div>
        ${sel.length ? '<div style="margin-top:12px"><button class="btn primary sm" data-act="pickDone">Done</button></div>' : ''}`
      : `<div class="sub" style="margin-top:6px">${sel.map(k => esc(ents.find(e => e.key === k)?.name)).join(', ')}</div>`}
    </section>
    ${sel.length ? `
    <div class="holes" role="group" aria-label="Holes">${holesNav}</div>
    <div class="hole-card">
      <div class="big num"><small>Hole</small>${hole}</div>
      <div class="hole-facts"><div><b class="num">${par}</b><span>Par</span></div><div><b class="num">${si}</b><span>Index</span></div></div>
    </div>
    <section class="panel" style="padding-block:4px">${entries}</section>
    <div class="navrow"><button class="btn" data-act="hole" data-id="${Math.max(1, hole - 1)}" ${hole === 1 ? 'disabled' : ''}>← Hole ${Math.max(1, hole - 1)}</button>
      <button class="btn primary" data-act="hole" data-id="${Math.min(18, hole + 1)}" ${hole === 18 ? 'disabled' : ''}>Hole ${Math.min(18, hole + 1)} →</button></div>
    <p class="sub">Tap the score box to start at par, then use − and +. Scores save as you go and show on the live board for everyone. Yellow dots mean a handicap shot on this hole.</p>` : ''}
  </div>`;
}

function drawTeams(r) {
  const size = r.format === 'fourbbb' ? 2 : (r.teamSize || 4);
  const ps = sortedPlayers().map(p => ({ id: p.id, k: baseH(r, p.id) + Math.random() * 4 })).sort((a, b) => a.k - b.k);
  const n = Math.max(1, Math.ceil(ps.length / size));
  const teams = [...Array(n)].map((_, i) => ({ id: uid('t'), name: '', playerIds: [] }));
  ps.forEach((p, i) => { const round = Math.floor(i / n); const idx = round % 2 === 0 ? i % n : n - 1 - (i % n); teams[idx].playerIds.push(p.id); });
  return teams;
}

/* ---------- main render ---------- */
function render() {
  renderHeader();
  const main = $('#main');
  if (S.mode === 'loading') { main.innerHTML = '<div class="empty">Loading the board…</div>'; return; }
  if (S.mode === 'offline' && !S.demo) { main.innerHTML = `<div class="stack"><section class="panel"><h2>Can't reach the scores</h2><p class="sub">The live scores didn't load. Check your signal and reopen the page. ${esc(S.err || '')}</p><button class="btn" data-act="demo">Preview with a sample trip</button></section></div>`; return; }
  // keep focus + unsaved typing across live re-renders
  const ae = document.activeElement; const focusId = ae && ae.id && main.contains(ae) ? ae.id : null;
  let selStart = null; try { selStart = focusId ? ae.selectionStart : null; } catch (e) {}
  const dirty = {}; main.querySelectorAll('[data-dirty]').forEach(el => { if (el.id) dirty[el.id] = el.value; });
  const scrollY = window.scrollY;
  const views = { board: viewBoard, score: viewScore, cards: viewCards, players: viewPlayers, photos: viewPhotos, trip: viewTrip, winners: viewWinners, formats: viewFormats, setup: viewSetup };
  main.innerHTML = (views[S.view] || viewBoard)();
  renderLightbox();
  for (const id in dirty) { const el = document.getElementById(id); if (el) { el.value = dirty[id]; el.dataset.dirty = '1'; } }
  if (focusId) { const el = document.getElementById(focusId); if (el) { el.focus({ preventScroll: true }); try { if (selStart != null) el.setSelectionRange(selStart, selStart); } catch (e) {} } }
  if (Math.abs(window.scrollY - scrollY) > 2) window.scrollTo(0, scrollY);
}

const VIEWS = ['board', 'score', 'cards', 'players', 'photos', 'trip', 'winners', 'formats', 'setup'];
function route() { const h = location.hash.slice(1); S.view = VIEWS.includes(h) ? h : 'board'; }
function go(v) { if (v !== 'players') S.profile = null; if (location.hash.slice(1) !== v) location.hash = v; else { S.view = v; render(); } window.scrollTo(0, 0); }
window.addEventListener('hashchange', () => { route(); render(); });

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const v = e.target.closest('[data-view]'); if (v && !v.matches('select,input')) { go(v.dataset.view); return; }
  const b = e.target.closest('[data-act]'); if (!b) return;

    case 'mfilter': S.mediaFilter = id; render(); break;

    case 'editWinner': S.editWinner = id; S.confirmWinner = null; render(); $('#winnerForm')?.scrollIntoView({ behavior: 'smooth' }); break;

      if (S.demo) delete S.winners[id]; else delDoc('winners/' + id); S.editWinner = null; S.confirmWinner = null; render(); break;
    case 'crown': { const { list } = tripStandings(); const w = list[0], last = list[list.length - 1];
      S.editWinner = 'new'; S.winnerDraft = { year: String(new Date().getFullYear()), champion: pname(w.pid), runnerUp: list[1] ? pname(list[1].pid) : '', spoon: last && last !== w ? pname(last.pid) : '', note: w.total + ' points', venue: [...new Set(sortedRounds().map(r => r.course).filter(Boolean))].join(', ') };
      render(); break; }
    case 'openMedia': if (id) { S.lightbox = id; S.confirmMedia = null; lbShown = null; render(); } break;
    case 'closeMedia': S.lightbox = null; render(); break;
    case 'delMedia': if (S.confirmMedia !== id) { S.confirmMedia = id; lbShown = null; render(); } else deleteMedia(id); break;

    case 'setpar': case 'inc': case 'dec': case 'pickup': {
      const C = course(r); const h = S.hole[r.id] || currentHole(r); S.hole[r.id] = h; const par = C.par[h - 1];
      const g = gv(r, id, h); let n;
      if (act === 'pickup') n = g === 'P' ? null : 'P';
      else if (g == null || g === 'P') n = act === 'dec' ? par - 1 : act === 'inc' ? par + 1 : par;

function currentHole(r) { return S.hole[r.id] || 1; }

document.addEventListener('input', e => { if (e.target.dataset.save) e.target.dataset.dirty = '1'; });
document.addEventListener('change', e => {

  delete el.dataset.dirty;

      <form class="stack" id="wForm" style="gap:12px"><div class="grid2">
        <div class="field"><label for="wYear">Year</label><input class="inp num" id="wYear" required maxlength="12" value="${esc(w.year || '')}" placeholder="2025"></div>
        <div class="field"><label for="wChamp">Champion</label><input class="inp" id="wChamp" required maxlength="60" list="wNames" value="${esc(w.champion || '')}" placeholder="Name"></div>
        <div class="field"><label for="wVenue">Where</label><input class="inp" id="wVenue" maxlength="80" value="${esc(w.venue || '')}" placeholder="Courses or town"></div>
        <div class="field"><label for="wNote">Winning score or note</label><input class="inp" id="wNote" maxlength="80" value="${esc(w.note || '')}" placeholder="68 points"></div>
        <div class="field"><label for="wRunner">Runner-up</label><input class="inp" id="wRunner" maxlength="60" list="wNames" value="${esc(w.runnerUp || '')}"></div>
        <div class="field"><label for="wSpoon">Wooden spoon (last place)</label><input class="inp" id="wSpoon" maxlength="60" list="wNames" value="${esc(w.spoon || '')}"></div>
      </div><datalist id="wNames">${sortedPlayers().map(p => `<option value="${esc(p.name)}"></option>`).join('')}</datalist>
      <div class="row"><button class="btn primary">Save</button><button type="button" class="btn" data-act="cancelWinner">Cancel</button>
        ${ed !== 'new' ? `<button type="button" class="btn danger sm" data-act="delWinner" data-id="${esc(ed)}">${S.confirmWinner === ed ? 'Tap again to remove' : 'Remove'}</button>` : ''}</div></form></section>` : '';
  return `<div class="stack">${demoBanner()}
    <section class="honours" aria-label="Honours board">
      <h2>Past Champions</h2><div class="rule"></div>
      ${!thisDone ? `<div class="hrow"><span class="yr">${yearNow}</span><span class="nm tbd">${leader ? `To be decided<small>${esc(pname(leader.pid))} leads on ${leader.total} pts</small>` : 'To be decided'}</span><span></span></div>` : ''}
      ${list.map(row).join('') || (thisDone ? '' : '<div class="hrow"><span class="yr"></span><span class="nm tbd"><small>Past winners go here. The organiser can add them.</small></span><span></span></div>')}
    </section>
    ${can ? `<div class="row">${!ed ? '<button class="btn primary sm" data-act="addWinner">Add a past winner</button>' : ''}${allFinal && !thisDone && leader && !ed ? `<button class="btn flagb sm" data-act="crown">Put ${esc(firstName(leader.pid))} on the board for ${yearNow}</button>` : ''}</div>` : ''}
    ${form}
  </div>`;
}
document.addEventListener('submit', e => {
  if (e.target.id !== 'wForm') return; e.preventDefault();
  const v = id => ($('#' + id)?.value || '').trim();
  const data = { year: v('wYear'), champion: v('wChamp'), venue: v('wVenue'), note: v('wNote'), runnerUp: v('wRunner'), spoon: v('wSpoon') };
  if (!data.year || !data.champion) return;
  const id = S.editWinner === 'new' ? uid('w') : S.editWinner;
  if (S.demo) { S.winners[id] = { id, ...data }; } else setDoc('winners/' + id, data);
  S.editWinner = null; S.winnerDraft = null; toast('Added to the board.'); render();
});

/* ---------- players, photos & media ---------- */
function safeUrl(u) { u = String(u || ''); return /^(data:image\/(jpeg|png|webp);base64,|data:video\/|https:\/\/|blob:|\/_blob\/)/.test(u) ? u : ''; }
function initials(pid) { return pname(pid).split(/\s+/).map(w => w[0] || '').join('').slice(0, 2); }
function avatar(pid, size = 32) {
  const u = safeUrl(S.players[pid]?.photo); const st = `width:${size}px;height:${size}px;font-size:${Math.round(size * .42)}px`;
  return u ? `<img class="av" src="${esc(u)}" alt="" style="${st}" loading="lazy">` : `<span class="av" style="${st}" aria-hidden="true">${esc(initials(pid))}</span>`;
}
function avatars(ids, size) { return `<span class="avs">${ids.slice(0, 4).map(id => avatar(id, size)).join('')}</span>`; }
const me = () => { const m = LS.get('golf.me', ''); return S.players[m] ? m : ''; };

function loadImage(file) { return new Promise((res, rej) => { const u = URL.createObjectURL(file); const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('image')); i.src = u; }); }
function toBlob(c, q) { return new Promise(r => c.toBlob(r, 'image/jpeg', q)); }
const toDataURL = b => new Promise(r => { const f = new FileReader(); f.onload = () => r(f.result); f.readAsDataURL(b); });
async function resizeImage(file, max, q = .82, square = false) {
  const img = await loadImage(file); let w = img.naturalWidth, h = img.naturalHeight, sx = 0, sy = 0, sw = w, sh = h;
  if (square) { const m = Math.min(w, h); sx = (w - m) / 2; sy = (h - m) / 2; sw = sh = m; w = h = Math.min(max, m); }
  else { const k = Math.min(1, max / Math.max(w, h)); w = Math.round(w * k); h = Math.round(h * k); }
  const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, w, h);
  return toBlob(c, q);
}
function videoThumb(file) {
  return new Promise(res => {
    const v = document.createElement('video'); let done = false; const fin = x => { if (!done) { done = true; res(x); } };
    v.muted = true; v.playsInline = true; v.preload = 'auto'; v.src = URL.createObjectURL(file);
    v.onloadeddata = () => { try { v.currentTime = Math.min(.5, (v.duration || 1) / 2); } catch (e) { fin(null); } };
    v.onseeked = async () => { try { const k = Math.min(1, 480 / Math.max(v.videoWidth, v.videoHeight)); const c = document.createElement('canvas'); c.width = Math.round(v.videoWidth * k); c.height = Math.round(v.videoHeight * k); c.getContext('2d').drawImage(v, 0, 0, c.width, c.height); fin(await toDataURL(await toBlob(c, .75))); } catch (e) { fin(null); } };
    v.onerror = () => fin(null); setTimeout(() => fin(null), 8000);
  });
}
const MAX_VIDEO = () => S.backend === 'firebase' ? 200 * 1048576 : 20 * 1048576;
async function storeFile(blob, kind) {
  if (S.demo) return { url: URL.createObjectURL(blob) };
  if (S.backend === 'firebase') {
    try {
      const path = 'media/' + uid('m') + (kind === 'video' ? '' : '.jpg');
      const ref = firebase.storage().ref(path); await ref.put(blob, { contentType: blob.type || (kind === 'video' ? 'video/mp4' : 'image/jpeg') });
      return { url: await ref.getDownloadURL(), path };
    } catch (e) {
      if (kind === 'image' && blob.size < 700000) return { url: await toDataURL(blob) };
      throw { code: 'no_storage' };
    }
  }
  const assets = await window.claude.use('assets'); if (!assets) throw { code: 'not_granted' };
  const r = await assets.upload(blob); return { url: r.url, assetId: r.id };
}
function uploadErr(e) {
  const c = e?.code;
  if (c === 'no_storage') return 'Videos need Firebase Storage switched on. Photos still work.';
  if (c === 'too_large') return 'That file is too big. Try a shorter clip.';
  if (c === 'not_granted' || c === 'not_uploader') return 'You need edit access to post photos. Ask the organiser.';
  if (c === 'unsupported_type') return 'That file type can\'t be posted. Try a JPEG photo or MP4 video.';
  if (c === 'quota_or_state' || c === 'quota_exceeded') return 'The trip album is full.';
  return 'Upload failed. Check your signal and try again.';
}
async function uploadMedia(files) {
  const by = me(); const caption = ($('#mCaption')?.value || '').trim().slice(0, 200); const roundId = $('#mRound')?.value || '';
  if (!by) { toast('Pick who\'s posting first.'); return; }
  let n = 0; const list = [...files];
  for (const f of list) {
    n++; S.uploading = `Uploading ${n} of ${list.length}…`; render();
    try {
      const isVideo = (f.type || '').startsWith('video/');
      if (isVideo && f.size > MAX_VIDEO()) { toast(`${f.name} is over ${Math.round(MAX_VIDEO() / 1048576)} MB. Trim it and try again.`); continue; }
      let blob = f, thumb;
      if (isVideo) thumb = await videoThumb(f);
      else { blob = await resizeImage(f, 1600, .82); thumb = await toDataURL(await resizeImage(f, 420, .72, true)); }
      const st = await storeFile(blob, isVideo ? 'video' : 'image');
      const doc = { type: isVideo ? 'video' : 'image', url: st.url, thumb: thumb || '', caption, by, roundId, createdAt: Date.now() };
      if (st.assetId) doc.assetId = st.assetId; if (st.path) doc.path = st.path;
      const id = uid('m');
      if (S.demo) { S.media[id] = { id, ...doc }; } else await setDoc('media/' + id, doc);
    } catch (e) { toast(e?.message === 'image' ? `Couldn't read ${f.name}. Try a JPEG.` : uploadErr(e)); }
  }
  S.uploading = ''; const c = $('#mCaption'); if (c) c.value = '';
  toast(list.length > 1 ? 'Posted to the album.' : 'Posted.'); render();
}
async function setProfilePhoto(pid, file) {
  try { S.uploading = 'Saving photo…'; render(); const blob = await resizeImage(file, 400, .8, true); const url = await toDataURL(blob); await updateDoc('players/' + pid, { photo: url }); toast('Looking sharp.'); }
  catch (e) { toast(e?.message === 'image' ? 'Couldn\'t read that photo. Try a JPEG.' : writeErr(e)); }
  S.uploading = ''; render();
}
const sortedMedia = () => Object.values(S.media).filter(m => safeUrl(m.url)).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
function thumbs(list) {
  return `<div class="mgrid">${list.map(m => `<button class="mthumb" data-act="openMedia" data-id="${esc(m.id)}" aria-label="${esc(m.caption || (m.type === 'video' ? 'Video' : 'Photo'))}">${safeUrl(m.thumb) || m.type !== 'video' ? `<img src="${esc(safeUrl(m.thumb) || safeUrl(m.url))}" alt="" loading="lazy">` : ''}${m.type === 'video' ? '<span class="play">▶ Video</span>' : ''}</button>`).join('')}</div>`;
}

function viewPlayers() {
  if (S.profile && S.players[S.profile]) return viewProfile(S.profile);
  const ps = sortedPlayers(); if (!ps.length) return welcome();
  const { list } = tripStandings(); const st = Object.fromEntries(list.map(x => [x.pid, x]));
  const missing = ps.filter(p => !safeUrl(p.photo)).length;
  return `<div class="stack">${demoBanner()}
    <div><h2>The players</h2><div class="sub">${missing ? `${missing} still need${missing === 1 ? 's' : ''} a photo. Tap your name to add one.` : 'Everyone has a photo. Good lads.'}</div></div>
    <div class="pgrid">${ps.map(p => `<button class="pcard" data-act="profile" data-id="${p.id}">
      ${avatar(p.id, 84)}<b>${esc(p.name)}</b><span class="nick">${p.nickname ? '“' + esc(p.nickname) + '”' : ''}</span>
      <span class="stat num">Hcp ${esc(p.hcp ?? 0)} · ${st[p.id] ? ordinal(st[p.id].pos) : '–'}</span>
      ${safeUrl(p.photo) ? '' : '<span class="need">Needs a photo</span>'}</button>`).join('')}</div></div>`;
}
function viewProfile(pid) {
  const p = S.players[pid]; const { list } = tripStandings(); const st = list.find(x => x.pid === pid);
  const ro = !S.canWrite && !S.demo;
  const results = sortedRounds().map(r => { const c = compute(r); const x = c.rows.find(x => x.unit.members.includes(pid)); if (!x) return ''; const t = scoreTile(r, x);
    return `<div class="spread" style="align-items:center;padding:8px 0;border-bottom:1px solid var(--line)"><span><b>${esc(r.name)} · ${esc(r.course || '')}</b><br><span class="sub">${esc(fmt(r).name)}${fmt(r).team ? ' with ' + esc(x.unit.members.filter(m => m !== pid).map(firstName).join(', ')) : ''}</span></span>
      <span class="row" style="flex-wrap:nowrap"><span class="thru">${x.pos ? (x.tied ? 'T' : '') + ordinal(x.pos) : (x.thru ? '' : 'Not started')}</span><span class="tile num ${t.cls}" style="min-width:64px">${esc(t.text)}<small>${esc(t.label)}</small></span></span></div>`; }).join('');
  const mine = sortedMedia().filter(m => m.by === pid);
  const isMe = me() === pid;
  return `<div class="stack">${demoBanner()}
    <div><button class="btn sm" data-act="profile" data-id="">← All players</button></div>
    <section class="panel stack">
      <div class="profile-hero">${avatar(pid, 120)}
        <div class="stack" style="gap:6px;min-width:0">
          <h2 style="font-size:34px">${esc(p.name)}</h2>
          ${p.nickname ? `<div class="sub" style="font-style:italic">“${esc(p.nickname)}”</div>` : ''}
          <div class="row"><span class="status">Hcp ${esc(p.hcp ?? 0)}</span>${st ? `<span class="status final">${ordinal(st.pos)} on the trip · ${st.total} pts</span>` : ''}</div>
          ${ro ? '' : `<div class="row" style="margin-top:6px">
            <label class="btn sm primary filebtn">${safeUrl(p.photo) ? 'Change photo' : 'Add photo'}<input type="file" accept="image/*" id="photoIn" data-pid="${pid}"></label>
            ${isMe ? '<span class="sub">This is you</span>' : `<button class="btn sm" data-act="iam" data-id="${pid}">This is me</button>`}</div>`}
        </div>
      </div>
      ${p.bio ? `<p style="margin:0;max-width:60ch">${esc(p.bio)}</p>` : ''}
    </section>
    ${ro ? '' : `<section class="panel stack"><h3>About</h3><div class="grid2">
      <div class="field"><label for="pnick_${pid}">Nickname</label><input class="inp" id="pnick_${pid}" data-save="pfield" data-f="nickname" data-id="${pid}" value="${esc(p.nickname || '')}" maxlength="40" placeholder="The Shank Redemption"></div>
      <div class="field"><label for="pbio_${pid}">Claim to fame</label><input class="inp" id="pbio_${pid}" data-save="pfield" data-f="bio" data-id="${pid}" value="${esc(p.bio || '')}" maxlength="160" placeholder="Hole in one at the 2019 Christmas comp"></div>
    </div></section>`}
    <section class="panel"><h3>This trip</h3><div style="margin-top:6px">${results || '<div class="sub">Not in any rounds yet.</div>'}</div></section>
    ${mine.length ? `<section class="stack" style="gap:10px"><h3>Posted by ${esc(firstName(pid))}</h3>${thumbs(mine)}</section>` : ''}
  </div>`;
}

function viewPhotos() {
  const ps = sortedPlayers(); const all = sortedMedia(); const ro = !S.canWrite && !S.demo;
  const f = S.mediaFilter || ''; const shown = f ? all.filter(m => m.roundId === f) : all;
  const live = sortedRounds().find(r => r.status === 'live');
  const cap = Math.round(MAX_VIDEO() / 1048576);
  return `<div class="stack">${demoBanner()}
    <div><h2>Photos &amp; videos</h2><div class="sub">${all.length} posted from the weekend.</div></div>
    ${ro ? '<div class="banner"><span>You can look, but only people with edit access can post. Ask the organiser.</span></div>' : `
    <section class="panel stack" style="gap:12px">
      <div class="grid2">
        <div class="field"><label for="mBy">Posting as</label><select class="inp" id="mBy"><option value="">Pick your name…</option>${ps.map(p => `<option value="${p.id}" ${p.id === me() ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select></div>
        <div class="field"><label for="mRound">Round</label><select class="inp" id="mRound"><option value="">Off the course</option>${sortedRounds().map(r => `<option value="${r.id}" ${live && live.id === r.id ? 'selected' : ''}>${esc(r.name)} · ${esc(r.course || '')}</option>`).join('')}</select></div>
        <div class="field"><label for="mCaption">Caption (optional)</label><input class="inp" id="mCaption" maxlength="200" placeholder="Robbo finds the beach on 16"></div>
      </div>
      <div class="row"><label class="btn primary filebtn">${S.uploading ? esc(S.uploading) : 'Add photos or videos'}<input type="file" id="mediaIn" accept="image/*,video/*" multiple ${S.uploading ? 'disabled' : ''}></label>
      <span class="sub">Videos up to ${cap} MB, so keep clips short.</span></div>
    </section>`}
    ${all.length ? `<div class="chips" role="group" aria-label="Filter"><button class="pick" data-act="mfilter" data-id="" aria-pressed="${!f}">All</button>${sortedRounds().map(r => `<button class="pick" data-act="mfilter" data-id="${r.id}" aria-pressed="${f === r.id}">${esc(r.course || r.name)}</button>`).join('')}</div>` : ''}
    ${shown.length ? thumbs(shown) : `<div class="empty panel">${all.length ? 'Nothing from this round yet.' : 'No photos yet. The first shank caught on camera goes here.'}</div>`}
  </div>`;
}
let lbShown = null;
function renderLightbox() {
  const box = $('#lightbox'); const id = S.lightbox; const m = id && S.media[id];
  if (!m) { if (lbShown) { box.innerHTML = ''; lbShown = null; } return; }
  if (lbShown === id) return; lbShown = id;
  const list = sortedMedia(); const i = list.findIndex(x => x.id === id);
  const canDel = S.demo || S.canEdit || (m.by && m.by === me());
  const url = esc(safeUrl(m.url)); const r = S.rounds[m.roundId];
  box.innerHTML = `<div class="lightbox" role="dialog" aria-modal="true" aria-label="Photo">
    <div class="bar"><span>${m.by ? avatar(m.by, 28) : ''} <b>${esc(m.by ? pname(m.by) : '')}</b> <small>${r ? esc(r.course || r.name) : ''}</small></span>
      <span class="row">${canDel ? `<button class="lbb del" data-act="delMedia" data-id="${esc(id)}">${S.confirmMedia === id ? 'Tap to confirm' : 'Delete'}</button>` : ''}<button class="lbb" data-act="closeMedia">Close</button></span></div>
    <div class="stage">${m.type === 'video' ? `<video src="${url}" controls playsinline autoplay ${safeUrl(m.thumb) ? `poster="${esc(safeUrl(m.thumb))}"` : ''}></video>` : `<img src="${url}" alt="${esc(m.caption || '')}">`}</div>
    <div class="bar"><button class="lbb" data-act="openMedia" data-id="${esc(list[i - 1]?.id || '')}" ${i > 0 ? '' : 'disabled style="opacity:.3"'}>← Newer</button><span style="flex:1;text-align:center">${esc(m.caption || '')}</span><button class="lbb" data-act="openMedia" data-id="${esc(list[i + 1]?.id || '')}" ${i < list.length - 1 ? '' : 'disabled style="opacity:.3"'}>Older →</button></div>
  </div>`;
}
async function deleteMedia(id) {
  const m = S.media[id]; if (!m) return;
  if (S.demo) { delete S.media[id]; }
  else {
    await delDoc('media/' + id);
    try { if (m.path && S.backend === 'firebase') await firebase.storage().ref(m.path).delete(); if (m.assetId && S.canEdit) { const a = await window.claude.use('assets'); await a?.delete(m.assetId); } } catch (e) {}
  }
  S.lightbox = null; S.confirmMedia = null; render(); toast('Deleted.');
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.lightbox) { S.lightbox = null; render(); } });

/* ---------- organiser PIN (web version) ---------- */
async function sha(t) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('golftrip:' + t)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
function pinScreen() {
  const has = !!S.trip.pinHash;
  return `<div class="stack"><section class="panel stack" style="max-width:420px">
    <h3>${has ? 'Organiser PIN' : 'Set an organiser PIN'}</h3>
    <p class="sub" style="margin:0">${has ? 'Setup is locked so only the organiser changes players, courses and teams. Everyone can still enter scores.' : 'Choose a PIN to lock Setup. You\'ll need it on any phone you organise from. Keep it to yourself.'}</p>
    <form id="pinForm" class="row"><input class="inp num" id="pinIn" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN" style="max-width:160px" required><button class="btn primary">${has ? 'Unlock' : 'Set PIN'}</button></form>
  </section></div>`;
}
async function unlock(pin) {
  if (!pin) return;
  const h = await sha(pin);
  if (!S.trip.pinHash) { await setDoc('trip/main', { ...S.trip, pinHash: h }); }
  else if (S.trip.pinHash !== h) { toast('That PIN doesn\'t match.'); return; }
  LS.set('golf.pin', h); S.canEdit = true; render();
}
document.addEventListener('submit', e => { if (e.target.id !== 'pinForm') return; e.preventDefault(); unlock($('#pinIn').value.trim()); });

/* Firebase adapter: same shape as the artifact db (doc/collection, set/update/get/delete/onSnapshot) */
function firebaseDb(fs) {
  const wrap = ref => ({ set: d => ref.set(d), update: d => ref.set(d, { merge: true }), delete: () => ref.delete(), get: () => ref.get(), onSnapshot: (n, e) => ref.onSnapshot(n, e) });
  return { doc: p => wrap(fs.doc(p)), collection: p => ({ onSnapshot: (n, e) => fs.collection(p).onSnapshot(n, e) }) };
}
async function initFirebase(cfg) {
  S.backend = 'firebase';
  const timer = setTimeout(() => { if (S.mode === 'loading') { S.mode = 'offline'; render(); } }, 12000);
  try {
    firebase.initializeApp(cfg);
    await firebase.auth().signInAnonymously();
    S.db = firebaseDb(firebase.firestore()); S.canWrite = true;
    subscribe(timer);
  } catch (e) { clearTimeout(timer); S.mode = 'offline'; S.err = e?.message; render(); }
}

/* ---------- boot ---------- */
async function init() {
  route(); render();
  if (window.GOLF_FIREBASE_CONFIG && window.firebase) { initFirebase(window.GOLF_FIREBASE_CONFIG); return; }
  const c = window.claude;
  if (!c || typeof c.use !== 'function') { startDemo(); return; }
  const timer = setTimeout(() => { if (S.mode === 'loading') { S.mode = 'offline'; render(); } }, 10000);
  const [db, user] = await Promise.all([c.use('db').catch(() => null), c.use('user').catch(() => null)]);
  S.user = user;
  if (!db) { clearTimeout(timer); startDemo(); return; }
  S.db = db;
  try { S.canEdit = user ? await user.canEdit() : false; const w = user ? await user.can('data.write') : null; S.canWrite = w !== false; } catch (e) {}
  subscribe(timer);
}
init();
})();
</script>
